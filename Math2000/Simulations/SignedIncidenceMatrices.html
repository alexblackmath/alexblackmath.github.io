<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Graph incidence matrix and RREF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --paper:#fbfcfd; --panel:#ffffff; --ink:#1b2433; --muted:#5d6b80; --faint:#b3bdcb;
  --rule:#dfe5ee; --grid:#edf1f6; --accent:#1f5fbf; --marker:#ffd84d; --node:#ffffff; --btn:#eef2f7;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#10151d; --panel:#151c26; --ink:#e4e9f1; --muted:#97a3b6; --faint:#465265;
    --rule:#263142; --grid:#1a2230; --accent:#78a9f0; --marker:#e9c33c; --node:#151c26; --btn:#1e2734;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#10151d; --panel:#151c26; --ink:#e4e9f1; --muted:#97a3b6; --faint:#465265;
  --rule:#263142; --grid:#1a2230; --accent:#78a9f0; --marker:#e9c33c; --node:#151c26; --btn:#1e2734;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;
}
.page{max-width:1240px;margin:0 auto;padding:24px clamp(16px,4vw,40px) 48px}
h2{font-family:"STIX Two Text","Times New Roman",Times,serif;font-weight:600;font-size:1.2rem;line-height:1.2;margin:0 0 10px}
h2 .dim{font-weight:400;color:var(--muted);font-size:1rem;margin-left:.35em}

.ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ctl label{font-weight:600;font-size:.95rem}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--panel)}
.stepper button{width:34px;height:34px;border:0;background:transparent;color:var(--ink);font-size:19px;cursor:pointer;font-family:inherit}
.stepper button:hover:not(:disabled){background:var(--btn)}
.stepper button:disabled{color:var(--faint);cursor:default}
.stepper output{min-width:30px;text-align:center;font-family:"STIX Two Text",serif;font-size:19px;font-variant-numeric:tabular-nums lining-nums}
input[type=range]{accent-color:var(--ink);width:150px;max-width:40vw}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.layout{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:32px 44px;align-items:start;margin-top:24px}
@media (max-width:880px){.layout{grid-template-columns:minmax(0,1fr)}}
.left{min-width:0}
.board{
  background-color:var(--panel);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:20px 20px;background-position:-1px -1px;
  border:1px solid var(--rule);border-radius:4px;max-width:400px;
}
#graph{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.edge .vis{stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
.edge .hit{stroke:transparent;stroke-width:18;cursor:pointer}
.edge:hover .vis{stroke-width:4}
.node{cursor:pointer}
.node circle{fill:var(--node);stroke:var(--ink);stroke-width:2}
.node:hover circle{stroke-width:3}
.node.sel circle{fill:var(--marker);stroke:var(--ink);stroke-width:3}
.node text{font-family:"STIX Two Text","Times New Roman",serif;font-size:18px;fill:var(--ink);pointer-events:none}
.node.sel text{fill:#1b2433}

.picker-wrap{margin-top:28px}
.picker{display:grid;gap:4px;width:max-content}
.picker .lab{font-family:"STIX Two Text",serif;font-size:15px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.picker button{width:28px;height:28px;padding:0;border:1px solid var(--rule);border-radius:5px;background:var(--btn);cursor:pointer}
.picker button:hover{border-color:var(--muted)}
.picker button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}

.right{display:flex;flex-direction:column;gap:30px;min-width:0}
.mat-scroll{overflow-x:auto;padding:4px 8px 10px 0}
.mat{display:grid;width:max-content;font-family:"STIX Two Text","Times New Roman",serif;font-size:17px;font-variant-numeric:tabular-nums lining-nums}
.mat .ch{font-family:"Instrument Sans",system-ui,sans-serif;font-size:11px;color:var(--muted);text-align:center;padding:0 1px 6px;white-space:nowrap;align-self:end}
.mat .rl{font-size:14px;font-style:italic;color:var(--muted);padding-right:14px;display:flex;align-items:center;justify-content:flex-end;min-width:32px}
.mat .c{display:flex;align-items:center;justify-content:center;width:38px;height:30px}
.mat .z{color:var(--faint)}
.mat .fr{font-size:13px}
.mat .br{position:relative;pointer-events:none}
.mat .br::before,.mat .br::after{content:"";position:absolute;top:-2px;bottom:-2px;width:8px;border:1.5px solid var(--ink)}
.mat .br::before{left:-3px;border-right:0}
.mat .br::after{right:-3px;border-left:0}
.empty{color:var(--muted);font-size:.95rem;margin:4px 0 0}
</style>
</head>
<body>
<main class="page">
  <div class="ctl">
    <label for="nRange">Vertices</label>
    <div class="stepper">
      <button type="button" id="nDec" aria-label="Fewer vertices">−</button>
      <output id="nOut" for="nRange">6</output>
      <button type="button" id="nInc" aria-label="More vertices">+</button>
    </div>
    <input type="range" id="nRange" min="2" max="10" step="1" value="6" aria-label="Number of vertices">
  </div>

  <div class="layout">
    <div class="left">
      <h2>Graph</h2>
      <div class="board">
        <svg id="graph" viewBox="0 0 360 360" aria-label="Graph drawing. Click two vertices to toggle an edge."></svg>
      </div>
      <div class="picker-wrap">
        <h2>Edges</h2>
        <div class="picker" id="picker" role="group" aria-label="Edge toggles"></div>
      </div>
    </div>

    <div class="right">
      <section>
        <h2>Incidence matrix<span class="dim" id="dimA"></span></h2>
        <div class="mat-scroll" id="matA"></div>
      </section>
      <section>
        <h2>Reduced row echelon form<span class="dim" id="dimR"></span></h2>
        <div class="mat-scroll" id="matR"></div>
      </section>
    </div>
  </div>
</main>

<script>
(() => {
  const MINUS = '\u2212';
  const $ = id => document.getElementById(id);
  const svg = $('graph'), picker = $('picker'), matA = $('matA'), matR = $('matR');
  const range = $('nRange'), nOut = $('nOut'), nDec = $('nDec'), nInc = $('nInc');

  let n = 6;
  let edges = new Set(['1-2', '1-3', '2-3', '3-4', '5-6']);
  let selected = null;

  const key = (i, j) => (i < j ? `${i}-${j}` : `${j}-${i}`);

  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a; }
  function Q(num, den = 1) {
    if (den < 0) { num = -num; den = -den; }
    const g = gcd(num, den) || 1;
    return { n: num / g, d: den / g };
  }
  const sub = (a, b) => Q(a.n * b.d - b.n * a.d, a.d * b.d);
  const mul = (a, b) => Q(a.n * b.n, a.d * b.d);
  const div = (a, b) => Q(a.n * b.d, a.d * b.n);

  function edgeList() {
    const E = [];
    for (let i = 1; i <= n; i++) for (let j = i + 1; j <= n; j++) if (edges.has(key(i, j))) E.push([i, j]);
    return E;
  }
  function incidence(E) {
    return Array.from({ length: n }, (_, r) => E.map(([i, j]) => (r + 1 === i ? 1 : r + 1 === j ? -1 : 0)));
  }
  function rref(M) {
    const rows = M.length, cols = rows ? M[0].length : 0;
    const A = M.map(row => row.map(v => Q(v)));
    let r = 0;
    for (let c = 0; c < cols && r < rows; c++) {
      let p = -1;
      for (let i = r; i < rows; i++) if (A[i][c].n !== 0) { p = i; break; }
      if (p < 0) continue;
      [A[r], A[p]] = [A[p], A[r]];
      const pv = A[r][c];
      A[r] = A[r].map(x => div(x, pv));
      for (let i = 0; i < rows; i++) {
        if (i === r || A[i][c].n === 0) continue;
        const f = A[i][c];
        A[i] = A[i].map((x, k) => sub(x, mul(f, A[r][k])));
      }
      r++;
    }
    return A;
  }

  function fmt(q) {
    if (q.n === 0) return '<span class="z">0</span>';
    const s = (q.n < 0 ? MINUS : '') + Math.abs(q.n) + (q.d !== 1 ? '/' + q.d : '');
    return `<span${q.d !== 1 ? ' class="fr"' : ''}>${s}</span>`;
  }

  function renderMatrix(el, data, E, rowLabels, empty) {
    const m = E.length, rows = data.length;
    if (m === 0) { el.innerHTML = `<p class="empty">${empty}</p>`; return; }
    let h = `<div class="mat" style="grid-template-columns:auto repeat(${m},38px);grid-template-rows:auto repeat(${rows},30px)">`;
    E.forEach(([i, j], c) => {
      h += `<div class="ch" style="grid-row:1;grid-column:${c + 2}">${i},${j}</div>`;
    });
    for (let r = 0; r < rows; r++) {
      h += `<div class="rl" style="grid-row:${r + 2};grid-column:1">${rowLabels ? rowLabels[r] : ''}</div>`;
      for (let c = 0; c < m; c++) {
        h += `<div class="c" style="grid-row:${r + 2};grid-column:${c + 2}">${fmt(data[r][c])}</div>`;
      }
    }
    h += `<div class="br" style="grid-row:2/${rows + 2};grid-column:2/${m + 2}"></div></div>`;
    el.innerHTML = h;
  }

  const C = 180, R = 138;
  function pos(v) {
    const a = -Math.PI / 2 + (2 * Math.PI * (v - 1)) / n;
    return [C + R * Math.cos(a), C + R * Math.sin(a)];
  }
  function renderGraph(E) {
    let h = '';
    for (const [i, j] of E) {
      const [x1, y1] = pos(i), [x2, y2] = pos(j);
      const ln = `x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"`;
      h += `<g class="edge" data-key="${key(i, j)}"><line class="vis" ${ln}/><line class="hit" ${ln}/></g>`;
    }
    for (let v = 1; v <= n; v++) {
      const [x, y] = pos(v);
      h += `<g class="node${selected === v ? ' sel' : ''}" data-v="${v}">` +
           `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="18"/>` +
           `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="central">${v}</text></g>`;
    }
    svg.innerHTML = h;
  }

  function renderPicker() {
    picker.style.gridTemplateColumns = `22px repeat(${n - 1},28px)`;
    let h = '';
    for (let j = 2; j <= n; j++) h += `<div class="lab" style="grid-row:1;grid-column:${j}">${j}</div>`;
    for (let i = 1; i < n; i++) {
      h += `<div class="lab" style="grid-row:${i + 1};grid-column:1">${i}</div>`;
      for (let j = i + 1; j <= n; j++) {
        const k = key(i, j);
        h += `<button type="button" data-key="${k}" aria-pressed="${edges.has(k)}" aria-label="Edge ${i}\u2013${j}" style="grid-row:${i + 1};grid-column:${j}"></button>`;
      }
    }
    picker.innerHTML = h;
  }

  function render() {
    const E = edgeList(), m = E.length;
    const M = incidence(E);

    range.value = n;
    nOut.value = n;
    nDec.disabled = n <= 2;
    nInc.disabled = n >= 10;

    renderGraph(E);
    renderPicker();

    $('dimA').textContent = `${n} \u00d7 ${m}`;
    $('dimR').textContent = `${n} \u00d7 ${m}`;
    renderMatrix(matA, M.map(row => row.map(v => Q(v))), E,
      Array.from({ length: n }, (_, i) => i + 1), 'No edges.');
    renderMatrix(matR, rref(M), E, null, 'No edges.');
  }

  function toggleEdge(k) { if (edges.has(k)) edges.delete(k); else edges.add(k); }

  function setN(v) {
    v = Math.max(2, Math.min(10, v));
    if (v === n) return;
    n = v;
    for (const k of [...edges]) if (+k.split('-')[1] > n) edges.delete(k);
    if (selected !== null && selected > n) selected = null;
    render();
  }
  range.addEventListener('input', () => setN(+range.value));
  nDec.addEventListener('click', () => setN(n - 1));
  nInc.addEventListener('click', () => setN(n + 1));

  svg.addEventListener('click', e => {
    const node = e.target.closest('[data-v]');
    const edge = e.target.closest('.edge');
    if (node) {
      const v = +node.getAttribute('data-v');
      if (selected === null) selected = v;
      else if (selected === v) selected = null;
      else { toggleEdge(key(selected, v)); selected = null; }
    } else if (edge) {
      edges.delete(edge.getAttribute('data-key'));
    } else {
      selected = null;
    }
    render();
  });

  picker.addEventListener('click', e => {
    const b = e.target.closest('button[data-key]');
    if (!b) return;
    const k = b.getAttribute('data-key');
    toggleEdge(k);
    render();
    const nb = picker.querySelector(`button[data-key="${k}"]`);
    if (nb) nb.focus();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && selected !== null) { selected = null; render(); }
  });

  render();
})();
</script>
</body>
</html>
