    if(state.puzzle.labels[i]==='O'||used.some(v=>samePoint(p,v)))return;
    used.push(p);const [x,y]=xy(p);
    if(isLive)out+=`<circle cx="${x}" cy="${y}" r="8" fill="${color}" opacity=".07"/><circle cx="${x}" cy="${y}" r="3.5" fill="${color}" stroke="#e0ffb3" stroke-width=".7"/>`;
    else if(isTarget)out+=`<circle cx="${x}" cy="${y}" r="7" fill="#11192c" fill-opacity=".5" stroke="${color}" stroke-width="1.6" stroke-dasharray="2.5 2"/><circle cx="${x}" cy="${y}" r="1.5" fill="${color}"/>`;
    else out+=`<circle cx="${x}" cy="${y}" r="5" fill="#0c1426" stroke="${color}" stroke-width="1.5"/>`;
  });
  return out;
}
function renderTrails(){
  const p=state.puzzle;let paths='';
  if(state.showTrails)p.source.forEach(v=>{const q=dotMap(state.matrix,v);if(samePoint(v,q))return;paths+=`<path d="${linePath(v,q)}"/>`;});
  $('#trail-layer').innerHTML=`<g stroke="#c6f879" stroke-width=".8" stroke-dasharray="2 7" opacity=".24" fill="none">${paths}</g>`;
}
function renderBasis(A){
  const el=$('#basis-layer');if(state.screen!=='tutorial'||state.step===0||state.step===3){el.innerHTML='';return [];}
  const e1=dotMap(A,[1,0]),e2=dotMap(A,[0,1]);
  el.innerHTML=`<path d="${linePath([0,0],e1)}" fill="none" stroke="#56dfff" stroke-width="2" marker-end="url(#arrow-cyan)"/><path d="${linePath([0,0],e2)}" fill="none" stroke="#b39aff" stroke-width="2" marker-end="url(#arrow-violet)"/>`;
  return [{p:e1,text:'Ae₁',kind:'source'},{p:e2,text:'Ae₂',kind:'target'}];
}
function renderLabels(live,basisLabels=[]){
  const p=state.puzzle,labels=[];
  function collect(points,kind){
    points.forEach((v,i)=>{
      if(p.labels[i]==='O')return;
      if(kind==='image'&&(samePoint(p.source[i],v,.0001)||(showTarget()&&samePoint(p.target[i],v,.0001))))return;
      const name=kind==='target'?p.labels[i]+'′':kind==='image'?'A'+p.labels[i]:p.labels[i];
      const existing=labels.find(d=>d.kind===kind&&samePoint(d.p,v,1e-7));
      if(existing)existing.text+=' / '+name;else labels.push({p:v,text:name,kind});
    });
  }
  collect(p.source,'source');if(showTarget())collect(p.target,'target');collect(live,'image');labels.push(...basisLabels);
  const occupied=[],pointBoxes=[...p.source,...(showTarget()?p.target:[]),...live].map(v=>{const [x,y]=xy(v);return {x:x-8,y:y-8,w:16,h:16};});
  const intersects=(a,b)=>a.x<b.x+b.w+4&&a.x+a.w+4>b.x&&a.y<b.y+b.h+3&&a.y+a.h+3>b.y;
  let html='';
  labels.forEach(label=>{
    const [x,y]=xy(label.p),w=label.text.length*7.4+4,h=15;
    const candidates=label.kind==='source'?[[-w-10,-22],[-w-10,7],[11,-22],[11,8],[-w/2,-34],[-w/2,22],[-w-20,-5],[23,-5]]:label.kind==='target'?[[12,-22],[12,8],[-w-11,-22],[-w-11,8],[-w/2,-34],[-w/2,22],[23,-5],[-w-20,-5]]:[[12,10],[-w-11,10],[12,-22],[-w-11,-22],[-w/2,25],[-w/2,-34],[23,-5],[-w-20,-5]];
    let best=null,bestScore=Infinity;
    for(const [dx,dy] of candidates){
      const box={x:Math.max(22,Math.min(PLOT.w-22-w,x+dx)),y:Math.max(20,Math.min(PLOT.h-20-h,y+dy)),w,h};
      const score=occupied.filter(b=>intersects(box,b)).length*10+pointBoxes.filter(b=>intersects(box,b)).length;
      if(score<bestScore){best=box;bestScore=score;}if(score===0)break;
    }
    occupied.push(best);
    html+=`<text x="${best.x+2}" y="${best.y+11.5}" font-size="11.5" fill="${SVG_COLORS[label.kind]}" stroke="#0c1426" stroke-width="4" stroke-linejoin="round" paint-order="stroke">${escapeHTML(label.text)}</text>`;
  });
  $('#label-layer').innerHTML=html;
}
function renderPlot(){
  if(!$('#plot')||!state.puzzle)return;
  const A=state.displayMatrix,p=state.puzzle,live=p.source.map(v=>dotMap(A,v));
  renderGrid();renderWarpedGrid(A);renderTrails();
  $('#static-shape-layer').innerHTML=shapeMarkup(p.source,'source',p.level)+(showTarget()?shapeMarkup(p.target,'target',p.level):'');
  $('#live-shape-layer').innerHTML=shapeMarkup(live,'image',p.level);
  const basis=renderBasis(A);renderLabels(live,basis||[]);
}
function updateMatrixDetails(){
  const A=state.matrix,el=$('#det-value');if(!el)return;
  const d=determinant(A);el.textContent=fmt(d);el.style.color=d===0?'var(--amber)':'var(--ink)';
  el.title=d===0?'Singular: the plane collapses.':`Area scale: ${fmt(Math.abs(d))}. ${d<0?'Orientation reverses.':'Orientation preserved.'}`;
  if(state.screen==='tutorial'){
    const q=dotMap(A,[2,1]);$('#formula-x').innerHTML=`x′ = 2a + b = <span class="formula-coordinate">${fmt(q[0])}</span>`;$('#formula-y').innerHTML=`y′ = 2c + d = <span class="formula-coordinate">${fmt(q[1])}</span>`;
  }
}
function animateMatrix(next,{replay=false,instant=false}={}){
  cancelAnimationFrame(state.anim);
  const from=replay?IDENTITY.slice():state.displayMatrix.slice(),fromScale=replay?desiredScale(IDENTITY):state.scale,toScale=desiredScale(next);
  state.matrix=next.slice();updateMatrixDetails();updateMapping();
  const duration=instant||reducedMotion.matches?0:720,routeToken=state.routeToken;
  let start=null;
  function frame(time){
    if(routeToken!==state.routeToken||!$('#plot'))return;
    if(start===null)start=time;
    const progress=duration===0?1:Math.min(1,(time-start)/duration),t=1-Math.pow(1-progress,3);
    state.displayMatrix=from.map((v,i)=>v+(next[i]-v)*t);
    // Fit as the point moves. The origin stays in exactly the same place.
    state.scale=Math.min(fromScale+(toScale-fromScale)*t,desiredScale(state.displayMatrix));
    renderPlot();
    if(progress<1)state.anim=requestAnimationFrame(frame);else{state.displayMatrix=next.slice();state.scale=toScale;state.anim=0;}
  }
  state.anim=requestAnimationFrame(frame);
}
function readMatrixInputs({report=true}={}){
  const inputs=$$('.matrix-input'),values=inputs.map(el=>parseScalar(el.value));
  if(inputs.length!==4)return null;
  const valid=values.every(v=>v!==null);state.lastValid=valid;
  inputs.forEach((el,i)=>el.setAttribute('aria-invalid',String(values[i]===null)));
  const help=$('#editor-help');
  if(report){help.classList.toggle('invalid',!valid);help.textContent=valid?'Numbers or fractions (1/2).':'Use numbers from −10,000 to 10,000. Fraction denominators cannot be zero.';}
  const check=$('#check-matrix')||$('#check-landing');if(check)check.disabled=!valid||state.solved;
  return valid?values:null;
}
function applyInput(){
  clearTimeout(state.debounce);const A=readMatrixInputs();if(!A)return;
  if(!state.solved)hideFeedback();
  $$('.preset').forEach(el=>el.classList.remove('selected'));
  animateMatrix(A);
  if(state.screen==='tutorial'&&state.step<2&&!A.every((v,i)=>v===IDENTITY[i]))completeTutorialTask();
}
function setMatrix(A,{preset=false,replay=false}={}){
  A.forEach((n,i)=>{$$('.matrix-input')[i].value=String(n);});
  const valid=readMatrixInputs();if(!valid)return;
  if(!state.solved)hideFeedback();
  animateMatrix(valid,{replay});
  if(state.screen==='tutorial'&&state.step<3&&preset)completeTutorialTask();
}
function hideFeedback(){const el=$('#feedback');if(el){el.hidden=true;el.innerHTML='';}}
function feedback(kind,title,message,actions=''){
  const el=$('#feedback');el.dataset.kind=kind;el.innerHTML=`<strong>${escapeHTML(title)}</strong>${message?`<p>${escapeHTML(message)}</p>`:''}${actions?`<div class="next-actions">${actions}</div>`:''}`;el.hidden=false;
}
function checkMatrix(){
  if(state.solved)return;
  clearTimeout(state.debounce);const A=readMatrixInputs();if(!A)return;
  animateMatrix(A);
  if(accepts(A,state.puzzle))solveRound(false);
  else{
    const i=state.puzzle.source.findIndex((p,i)=>!samePoint(dotMap(A,p),state.puzzle.target[i],1e-7)),name=state.puzzle.labels[i],image=dotMap(A,state.puzzle.source[i]);
    feedback('error','Not matched',`A${name} = ${coord(image)}; ${name}′ = ${coord(state.puzzle.target[i])}.`);
  }
}
function checkNoSolution(){
  if(state.solved)return;
  clearTimeout(state.debounce);
  // This decision is about real linear maps, not just the integer generator.
  if(findMap(state.puzzle.source,state.puzzle.target)===null)solveRound(true);
  else{
    let message;
    if(state.stage===1)message=state.puzzle.hint;
    else if(state.level===4)message='Independent U and V determine a unique matrix.';
    else if(state.puzzle.source.every(isZero))message='Every matrix maps (0, 0) to (0, 0).';
    else message='Solve for each row of A.';
    feedback('error','A matrix exists',message);
  }
}
function solveRound(impossible){
  if(state.solved)return;state.solved=true;
  const before=stageCount(state.level,state.stage);
  progress.solves[state.level-1][state.stage-1]++;saveProgress();
  const stageCompleted=before===MASTERY_GOAL-1;
  const mastered=stageCompleted&&levelMastered(state.level);
  $('#work-status').innerHTML=masteryMarkup();$('#check-matrix').disabled=true;$('#no-solution').disabled=true;
  $$('.stage-switcher a').forEach((el,i)=>el.setAttribute('aria-label',stageLabel(state.level,i+1)));
  $('#new-challenge').hidden=true;
  const title=mastered?'Mastered':stageCompleted?'Stage complete':impossible?'Correct — no matrix exists':'Correct';
  const body=impossible?state.puzzle.reason:'';
  let advance='';
  if(stageCompleted){
    if(!levelMastered(state.level)){
      const otherStage=state.stage===1?2:1;
      advance=`<a class="btn btn-primary" href="${levelHref(state.level,otherStage)}">Stage ${otherStage} →</a>`;
    }else if(state.level<4){
      advance=`<a class="btn btn-primary" href="${levelHref(state.level+1)}">Level ${state.level+1} →</a>`;
    }
  }
  const actions=`${advance}<button id="next-challenge" class="btn ${advance?'btn-quiet':'btn-primary'}">${stageCompleted?'Keep practicing':'Next →'}</button>`;
  feedback('success',title,body,actions);$('#next-challenge').addEventListener('click',()=>startRound(false));
}
function completeTutorialTask(){
  if(state.taskDone)return;state.taskDone=true;
  const task=$('#tutorial-task');task.textContent='✓ '+LESSONS[state.step].done;task.classList.add('complete');
  const next=$('#tutorial-next');if(next)next.disabled=false;
}
function checkLanding(){
  if(state.solved)return;clearTimeout(state.debounce);const A=readMatrixInputs();if(!A)return;animateMatrix(A);
  if(accepts(A,state.puzzle)){
    state.solved=true;completeTutorialTask();progress.tutorial=true;saveProgress();$('#check-landing').disabled=true;
    feedback('success','Correct','',`<a class="btn btn-primary" href="#level-1-stage-1">Level 1 →</a><button class="btn btn-quiet" id="keep-exploring">Presets</button>`);
    $('#keep-exploring').addEventListener('click',()=>{state.step=2;startTutorialStep();});
  }else feedback('error','Not matched',`AP = ${coord(dotMap(A,[2,1]))}; P′ = (3, 2).`);
}
function bindWorkspace(){
  $$('.matrix-input').forEach(el=>{
    el.addEventListener('focus',()=>el.select());
    el.addEventListener('input',()=>{clearTimeout(state.debounce);readMatrixInputs();state.debounce=setTimeout(applyInput,150);});
    el.addEventListener('keydown',event=>{
      if(event.key==='Enter'){event.preventDefault();state.screen==='tutorial'?(state.step===3?checkLanding():applyInput()):checkMatrix();}
      if(event.key==='Escape'){event.preventDefault();setMatrix(IDENTITY);}
    });
  });
  $('#grid-toggle').addEventListener('change',event=>{state.showGrid=event.target.checked;renderPlot();});
  $('#trail-toggle').addEventListener('change',event=>{state.showTrails=event.target.checked;renderPlot();});
  $('#replay').addEventListener('click',()=>{clearTimeout(state.debounce);const A=readMatrixInputs();if(A)animateMatrix(A,{replay:true});});
  $('#hint-toggle')?.addEventListener('click',()=>{const hint=$('#hint-box'),button=$('#hint-toggle');hint.hidden=!hint.hidden;button.setAttribute('aria-expanded',String(!hint.hidden));button.textContent=hint.hidden?'Hint':'Hide hint';});
  if(state.screen==='game'){
    $('#check-matrix').addEventListener('click',checkMatrix);$('#no-solution').addEventListener('click',checkNoSolution);$('#new-challenge').addEventListener('click',()=>startRound(false));
  }else{
    $('#reset-matrix')?.addEventListener('click',()=>{setMatrix(IDENTITY);$$('.preset').forEach(el=>el.classList.remove('selected'));});
    $('#tutorial-next')?.addEventListener('click',()=>{if(state.taskDone){state.step++;startTutorialStep();}});
    $('#tutorial-back')?.addEventListener('click',()=>{state.step--;startTutorialStep();});
    $('#check-landing')?.addEventListener('click',checkLanding);
    const presets={rotate:[0,-1,1,0],stretch:[2,0,0,1],shear:[1,1,0,1],reflect:[-1,0,0,1]};
    $$('.preset').forEach(el=>el.addEventListener('click',()=>{setMatrix(presets[el.dataset.preset],{preset:true});$$('.preset').forEach(button=>button.classList.toggle('selected',button===el));}));
  }
}
function startRound(resetNumber=false){
  cancelAnimationFrame(state.anim);clearTimeout(state.debounce);state.routeToken++;
  state.puzzle=generatePuzzle(state.level,state.stage);state.matrix=IDENTITY.slice();state.displayMatrix=IDENTITY.slice();state.solved=false;state.lastValid=true;
  state.round=resetNumber?1:state.round+1;state.scale=desiredScale(IDENTITY);
  renderWorkspace();
}
function startTutorialStep(){
  cancelAnimationFrame(state.anim);clearTimeout(state.debounce);state.routeToken++;
  state.puzzle={level:1,source:[[2,1]],target:[[3,2]],labels:['P'],solution:[1,1,0,2],possible:true};
  state.solved=false;state.taskDone=false;state.matrix=IDENTITY.slice();state.displayMatrix=IDENTITY.slice();state.lastValid=true;
  state.showGrid=state.step===1||state.step===2;state.scale=desiredScale(IDENTITY);renderWorkspace();
}
function route(){
  cancelAnimationFrame(heroAnim);cancelAnimationFrame(state.anim);clearTimeout(state.debounce);state.routeToken++;
  const hash=location.hash.replace('#','');const levelMatch=hash.match(/^level-([1-4])(?:-stage-([12]))?$/);
  if(hash==='tutorial'){state.screen='tutorial';state.step=0;startTutorialStep();}
  else if(levelMatch){state.screen='game';state.level=Number(levelMatch[1]);state.stage=levelMatch[2]?Number(levelMatch[2]):recommendedStage(state.level);state.showGrid=false;startRound(true);}
  else{state.screen='home';if(plotObserver)plotObserver.disconnect();renderHome();}
  $('#nav-home').classList.toggle('active',state.screen==='home');$('#nav-tutorial').classList.toggle('active',state.screen==='tutorial');
  $('#nav-home').setAttribute('aria-current',state.screen==='home'?'page':'false');$('#nav-tutorial').setAttribute('aria-current',state.screen==='tutorial'?'page':'false');
  document.title=state.screen==='home'?'Linear Lab':state.screen==='tutorial'?'Tutorial — Linear Lab':`${LEVELS[state.level-1].name} · Stage ${state.stage} — Linear Lab`;
  window.scrollTo({top:0,behavior:'instant'});
}
window.addEventListener('hashchange',route);
window.addEventListener('pagehide',()=>{cancelAnimationFrame(heroAnim);cancelAnimationFrame(state.anim);saveProgress();});
window.addEventListener('pageshow',event=>{if(event.persisted)route();});
route();
</script>
