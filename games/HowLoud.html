<script>
'use strict';
(() => {
  /* Level design follows HowLoud.html: five rounds per level; any integer
     matrices with the required sum of absolute determinants are accepted.
     Level 4 uses the same starting-matrix ranges and row-operation factors.
     The UI palette and controls follow Determinant Lab. No external assets. */
  const $ = id => document.getElementById(id);
  const TOTAL = 5;
  const NAMES = ['Triangles', 'Quadrilaterals', 'Pentagons', 'Row operations'];
  const LETTERS = ['A', 'B', 'C', 'D', 'E'];
  const C = {cyan:'#56dfff', violet:'#b39aff', lime:'#c6f879', ink:'#f3f6ff', muted:'#95a2bd', bg:'#0c1426'};
  const state = {level:1, round:1, score:0, mistakes:0, answered:false, complete:false, polygon:null, challenge:null, sound:true};
  let fields = [], audio = null, timers = [], drawFrame = 0;
  const randomInt = (min,max) => Math.floor(Math.random() * (max-min+1)) + min;
  const choose = a => a[randomInt(0,a.length-1)];
  const cross = (o,a,b) => (a.x-o.x)*(b.y-o.y)-(a.y-o.y)*(b.x-o.x);
  const determinant = m => m[0][0]*m[1][1]-m[0][1]*m[1][0];
  const detBig = a => a[0]*a[3]-a[1]*a[2];
  const absBig = x => x < 0n ? -x : x;
  const fmt = n => String(Object.is(n,-0)?0:n).replaceAll('-','−');
  const svgNum = n => Number(n.toFixed(2));
  const areaText = twice => {const n=typeof twice==='bigint'?twice:BigInt(twice);return String(n/2n)+(n%2n?'.5':'');};
  function doubledArea(points) {
    return Math.abs(points.reduce((sum,p,i) => {const q=points[(i+1)%points.length];return sum+p.x*q.y-p.y*q.x;},0));
  }
  function convexHull(points) {
    const sorted=[...points].sort((a,b)=>a.x-b.x||a.y-b.y), lower=[], upper=[];
    for(const p of sorted){while(lower.length>=2&&cross(lower.at(-2),lower.at(-1),p)<=0)lower.pop();lower.push(p);}
    for(const p of sorted.reverse()){while(upper.length>=2&&cross(upper.at(-2),upper.at(-1),p)<=0)upper.pop();upper.push(p);}
    lower.pop();upper.pop();return lower.concat(upper);
  }
  function makePolygon(n) {
    for(let attempt=0;attempt<3000;attempt++) {
      const unique=new Map();
      for(let k=0;k<100 && unique.size<n;k++){const p={x:randomInt(0,10),y:randomInt(0,10)};unique.set(`${p.x},${p.y}`,p);}
      if(unique.size!==n)continue;
      const points=convexHull([...unique.values()]), twiceArea=doubledArea(points);
      if(points.length===n&&twiceArea>=n)return {points,twiceArea};
    }
    // A finite fallback keeps unusual random-number environments responsive.
    const fallback={3:[[1,1],[9,2],[4,9]],4:[[1,1],[8,1],[9,8],[2,9]],5:[[1,2],[6,0],[10,5],[7,10],[1,8]]};
    const points=fallback[n].map(([x,y])=>({x,y}));return {points,twiceArea:doubledArea(points)};
  }
  function makeRowChallenge() {
    let A=[[2,1],[1,2]];
    for(let i=0;i<1000;i++) {
      const m=[[randomInt(-4,4),randomInt(-4,4)],[randomInt(-4,4),randomInt(-4,4)]];
      if(determinant(m)!==0&&Math.abs(determinant(m))<=24){A=m;break;}
    }
    const B=A.map(row=>[...row]), kind=choose(['swap','scale','add']);
    let row=0, factor=1;
    if(kind==='swap')[B[0],B[1]]=[B[1],B[0]];
    else if(kind==='scale'){row=randomInt(0,1);factor=choose([-3,-2,-1,2,3]);B[row]=B[row].map(x=>factor*x);}
    else {row=randomInt(0,1);factor=choose([-3,-2,-1,1,2,3]);B[row]=B[row].map((x,i)=>x+factor*A[1-row][i]);}
    return {A,B,kind,row,factor,areaA:Math.abs(determinant(A)),areaB:Math.abs(determinant(B))};
  }
  function matrixInputs(index) {
    const inputs=Array.from({length:4},(_,i)=>`<input class="matrix-input${i>=2?' row2':''}" id="m${index}-${i}" type="text" inputmode="text" autocomplete="off" spellcheck="false" maxlength="24" aria-label="Matrix ${index+1}, row ${Math.floor(i/2)+1}, column ${i%2+1}" aria-describedby="prompt feedback" placeholder="·">`).join('');
    return `<div class="det-term" role="group" aria-label="One half of the absolute determinant of matrix ${index+1}"><span class="fraction" aria-hidden="true"><span>1</span><span>2</span></span><div class="absolute"><span class="det-word" aria-hidden="true">det</span><div class="matrix-brackets"><div class="matrix-inputs">${inputs}</div></div></div></div>`;
  }
  function staticMatrix(name,m) {
    const cells=m.flat().map(v=>`<span class="static-cell">${fmt(v)}</span>`).join('');
    return `<div class="matrix-display" aria-label="Matrix ${name}"><span class="matrix-letter" aria-hidden="true">${name} =</span><div class="matrix-brackets"><div class="static-grid" data-matrix="${name}">${cells}</div></div></div>`;
  }
  function renderEntries() {
    if(state.level<4){
      $('entryRegion').innerHTML=`<div class="expression">${Array.from({length:state.level},(_,i)=>matrixInputs(i)).join('<div class="plus" aria-hidden="true">+</div>')}</div>`;
    } else {
      const q=state.challenge;
      $('entryRegion').innerHTML=`<div class="comparison"><section class="comparison-item" aria-label="Given matrix A">${staticMatrix('A',q.A)}<div class="area-readout"><span class="area-label">Area</span><span id="areaA" class="area-value">${q.areaA}</span></div></section><section class="comparison-item" aria-label="Find the area for matrix B">${staticMatrix('B',q.B)}<div class="area-readout"><label class="area-label" for="areaB">Area</label><input id="areaB" class="area-input" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" maxlength="24" placeholder="?" aria-label="Area of B’s parallelogram" aria-describedby="prompt feedback"></div></section></div>`;
    }
    fields=[...$('entryRegion').querySelectorAll('input')];
    fields.forEach((input,index)=>{
      input.addEventListener('input',()=>{
        input.removeAttribute('aria-invalid');
        if(!state.answered)setFeedback('');
        if(input.classList.contains('matrix-input'))input.style.fontSize=input.value.length>8?'10px':input.value.length>4?'14px':'';
        else input.style.fontSize=input.value.length>8?'13px':'';

  }
  function setFeedback(text,kind='') {
    $('feedback').textContent=text;$('feedback').dataset.kind=kind;
  }
  function updateScore() {
    $('score').textContent=`${state.score} pts`;$('score').setAttribute('aria-label',`Score: ${state.score} points`);
  }
  function setupRound() {
    state.mistakes=0;state.answered=false;state.complete=false;
    closeHint();document.body.dataset.complete='false';
    $('answerForm').hidden=false;$('complete').hidden=true;$('round').hidden=false;
    $('round').textContent=`${state.round} / ${TOTAL}`;$('round').setAttribute('aria-label',`Round ${state.round} of ${TOTAL}`);
    $('prompt').textContent=state.level===4?'Find the area of B.':'Match the area.';
    $('checkText').textContent='Check';$('check').setAttribute('aria-label','Check answer');$('hintButton').hidden=false;
    setFeedback('');updateScore();
    const rows=state.level===4;
    $('plots').classList.toggle('dual',rows);$('paneB').hidden=!rows;$('nameA').hidden=!rows;
    if(rows){state.challenge=makeRowChallenge();state.polygon=null;}
    else {state.polygon=makePolygon(state.level+2);state.challenge=null;}
    renderEntries();scheduleDraw();
  }
  function startLevel(level) {
    if(!Number.isInteger(level)||level<1||level>4)return;
    clearTimers();state.level=level;state.round=1;state.score=0;document.body.dataset.level=String(level);
    NAMES.forEach((name,i)=>{const el=$('level'+(i+1)),on=i+1===level;el.setAttribute('aria-selected',String(on));el.tabIndex=on?0:-1;});
    $('levelPanel').setAttribute('aria-labelledby','level'+level);$('levelName').textContent=NAMES[level-1];
    setupRound();
  }
  function readInteger(input) {
    const raw=input.value.trim().replaceAll('−','-');

    if(!/^[+-]?\d+$/.test(raw))return null;
    try{return BigInt(raw);}catch{return null;}
  }
  function checkAnswer() {
    if(state.complete)return;
    if(state.answered){advance();return;}
    closeHint();let correct=false, submittedTwice=0n;
    if(state.level===4){
      const raw=fields[0].value.trim().replaceAll('−','-');

    }
    if(correct){
      state.answered=true;state.score+=Math.max(40,100-state.mistakes*15);updateScore();
      const answer=state.level===4?String(state.challenge.areaB):areaText(state.polygon.twiceArea);
      setFeedback(`Correct · area ${answer}`,'good');
      fields.forEach(input=>{input.readOnly=true;input.removeAttribute('aria-invalid');});
      $('checkText').textContent=state.round===TOTAL?'Finish':'Next';$('check').setAttribute('aria-label',state.round===TOTAL?'Finish level':'Next round');
      $('hintButton').hidden=true;$('check').focus({preventScroll:true});
      playTone(true,state.level===4?state.challenge.areaB:state.polygon.twiceArea);
    } else {
      state.mistakes++;
      let text='Try again.';
      if(state.level<4){const area=areaText(submittedTwice);if(area.length<=14)text=`Not quite · your area ${area}`;}
      setFeedback(text,'bad');playTone(false);
    }
  }
  function advance() {
    if(!state.answered || state.complete)return;
    if(state.round<TOTAL){state.round++;setupRound();if(!window.matchMedia('(pointer:coarse)').matches)fields[0].focus({preventScroll:true});return;}
    state.complete=true;document.body.dataset.complete='true';closeHint();
    $('answerForm').hidden=true;$('complete').hidden=false;$('round').hidden=true;
    $('finalScore').textContent=String(state.score);$('continueText').textContent=state.level<4?'Next level':'Play again';$('replay').hidden=state.level===4;
    $('completeTitle').focus({preventScroll:true});scheduleDraw();
    [0,150,300].forEach((delay,i)=>timers.push(setTimeout(()=>playTone(true,18+i*20),delay)));
  }
  function closeHint(focus=false) {
    $('hint').hidden=true;$('hintButton').setAttribute('aria-expanded','false');$('hintButton').setAttribute('aria-label','Show hint');
    if(focus)$('hintButton').focus({preventScroll:true});
  }
  function showHint() {
    if(!$('hint').hidden){closeHint(true);return;}
    if(state.level===4){
      $('hintContent').innerHTML='<h2>For B = [a b; c d]</h2><div class="hint-math">Area = |ad − bc|</div>';
    } else {
      const points=state.polygon.points, o=points[0];
      const pairLines=Array.from({length:state.level},(_,i)=>{
        const u=points[i+1],v=points[i+2];
        return `<div class="hint-pair"><span class="hint-triangle">A${LETTERS[i+1]}${LETTERS[i+2]}</span><span><span class="hint-row1">(${fmt(u.x-o.x)}, ${fmt(u.y-o.y)})</span><span style="color:#70819e"> ; </span><span class="hint-row2">(${fmt(v.x-o.x)}, ${fmt(v.y-o.y)})</span></span></div>`;
      }).join('');
      $('hintContent').innerHTML=`<h2>Use these row pairs from A.</h2><div class="hint-vectors">${pairLines}</div>`;
    }
    $('hint').hidden=false;$('hintButton').setAttribute('aria-expanded','true');$('hintButton').setAttribute('aria-label','Hide hint');$('hint').focus({preventScroll:true});
  }
  // Responsive SVG graphs use CSS-pixel view boxes, so strokes and type stay crisp.
  function niceStep(n) {
    const base=10**Math.floor(Math.log10(n)), f=n/base;
    return (f<=1?1:f<=2?2:f<=5?5:10)*base;
  }
  function pointMap(W,H,camera) {return p=>({x:W/2+(p.x-camera.x)*camera.scale,y:H/2-(p.y-camera.y)*camera.scale});}
  function path(points,map,close=true) {return points.map((p,i)=>{const q=map(p);return `${i?'L':'M'}${svgNum(q.x)},${svgNum(q.y)}`;}).join(' ')+(close?' Z':'');}
  function grid(W,H,camera,reserved=[]) {
    const {x:cx,y:cy,scale:s}=camera, map=pointMap(W,H,camera), o=map({x:0,y:0});
    const x0=cx-W/(2*s),x1=cx+W/(2*s),y0=cy-H/(2*s),y1=cy+H/(2*s);
    const minor=niceStep(13/s),major=niceStep(45/s), tick=niceStep(45/s);
    const clearOfLabels=box=>!reserved.some(r=>overlap(box,{x:r.x-3,y:r.y-3,w:r.w+6,h:r.h+6})>0);
    const lines=(step,color,width)=>{
      let d='';
      for(let i=Math.ceil(x0/step);i<=Math.floor(x1/step);i++){const x=svgNum(map({x:i*step,y:0}).x);d+=`M${x},0V${H}`;}
      for(let i=Math.ceil(y0/step);i<=Math.floor(y1/step);i++){const y=svgNum(map({x:0,y:i*step}).y);d+=`M0,${y}H${W}`;}

    };

    out+=`<path d="M0,${svgNum(o.y)}H${W-9}m-5,-3 5,3-5,3 M${svgNum(o.x)},${H}V9m-3,5 3,-5 3,5" fill="none" stroke="#8298b580" stroke-width="1"/>`;
    out+='<g fill="#7e91ad" font-size="10" font-family="ui-monospace,monospace">';
    for(let i=Math.ceil(x0/tick);i<=Math.floor(x1/tick);i++){
      if(!i)continue;const v=Number((i*tick).toPrecision(9)),x=map({x:v,y:0}).x;
      if(x<21||x>W-28)continue;
      const text=fmt(v), width=textWidth(text,10);
      if(!clearOfLabels({x:x-width/2,y:Math.min(H-9,o.y+17)-10,w:width,h:13}))continue;
      out+=`<text x="${svgNum(x)}" y="${svgNum(Math.min(H-9,o.y+17))}" text-anchor="middle">${fmt(v)}</text>`;
    }
    for(let i=Math.ceil(y0/tick);i<=Math.floor(y1/tick);i++){
      if(!i)continue;const v=Number((i*tick).toPrecision(9)),y=map({x:0,y:v}).y;
      if(y<24||y>H-14)continue;
      const width=textWidth(fmt(v),10);
      if(!clearOfLabels({x:Math.max(24,o.x-10)-width,y:y-8,w:width,h:13}))continue;
      out+=`<text x="${svgNum(Math.max(24,o.x-10))}" y="${svgNum(y+3)}" text-anchor="end">${fmt(v)}</text>`;
    }
    if(clearOfLabels({x:o.x-16,y:o.y+7,w:9,h:13}))out+=`<text x="${svgNum(o.x-9)}" y="${svgNum(o.y+17)}" text-anchor="end">0</text>`;
    out+=`<text x="${W-13}" y="${svgNum(Math.min(H-9,o.y+18))}" text-anchor="end">x</text><text x="${svgNum(o.x+11)}" y="20">y</text></g>`;

  }
  const measure=document.createElement('canvas').getContext('2d');
  function textWidth(s,font=12){measure.font=`${font}px ui-monospace,Consolas,monospace`;return measure.measureText(s).width;}
  const overlap=(a,b)=>Math.max(0,Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x))*Math.max(0,Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y));
  function inside(p,poly) {
    let result=false;
    for(let i=0,j=poly.length-1;i<poly.length;j=i++){
      const a=poly[i],b=poly[j];
      if((a.y>p.y)!==(b.y>p.y) && p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x)result=!result;
    }
    return result;
  }
  function labelPositions(points,texts,center,W,H,polygon=points,reserved=[]) {
    const placed=[...reserved];
    return points.map((p,index)=>{
      const w=textWidth(texts[index])+2,h=18,base=Math.atan2(p.y-center.y,p.x-center.x);
      let best=null,bestCost=Infinity;
      for(const offset of [0,.35,-.35,.75,-.75,1.2,-1.2,1.8,-1.8,Math.PI]){
        const a=base+offset,nx=Math.cos(a),ny=Math.sin(a),d=12+Math.abs(nx)*w/2+Math.abs(ny)*h/2;
        const raw={x:p.x+nx*d-w/2,y:p.y+ny*d-h/2,w,h};
        const box={...raw,x:Math.max(8,Math.min(W-w-8,raw.x)),y:Math.max(8,Math.min(H-h-8,raw.y))};

        let cost=Math.abs(offset)*5+Math.abs(box.x-raw.x)*3+Math.abs(box.y-raw.y)*3;

        for(const q of points)cost+=overlap(box,{x:q.x-9,y:q.y-9,w:18,h:18})*8;
        if(cost<bestCost){best=box;bestCost=cost;}

  function drawPolygon(svg,W,H) {
    const points=state.polygon.points;
    const camera={x:5,y:5,scale:Math.max(5,Math.min((W-112)/10,(H-112)/10))},map=pointMap(W,H,camera);
    const plotted=points.map(map),center={x:plotted.reduce((s,p)=>s+p.x,0)/plotted.length,y:plotted.reduce((s,p)=>s+p.y,0)/plotted.length};
    const labels=points.map((p,i)=>`${LETTERS[i]} (${p.x}, ${p.y})`);

    out+=`<path d="${path(points,map)}" fill="#c6f87914" stroke="#79c1c9" stroke-opacity=".8" stroke-width="1.6" stroke-linejoin="round"/>`;
    if(points.length>3){
      let d='';for(let i=2;i<points.length-1;i++)d+=path([points[0],points[i]],map,false);
      out+=`<path d="${d}" fill="none" stroke="${C.violet}" stroke-opacity=".7" stroke-width="1.2" stroke-dasharray="5 6"/>`;
    }
    plotted.forEach((p,i)=>{
      out+=`<circle cx="${svgNum(p.x)}" cy="${svgNum(p.y)}" r="3.2" fill="#dfeafb" stroke="${C.bg}" stroke-width="1.3"/>`;
      const b=positions[i],v=points[i];
      out+=`<text x="${svgNum(b.x)}" y="${svgNum(b.y+b.h/2)}" dominant-baseline="central" font-size="12" fill="${C.ink}" stroke="${C.bg}" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan>${LETTERS[i]}</tspan><tspan fill="${C.muted}"> (${v.x}, ${v.y})</tspan></text>`;
    });
    svg.setAttribute('aria-label',`${NAMES[state.level-1].slice(0,-1)} with vertices ${points.map((p,i)=>`${LETTERS[i]} (${p.x}, ${p.y})`).join('; ')}.${state.level>1?' Dashed diagonals from A divide it into '+state.level+' triangles.':''}`);
    svg.innerHTML=out;
  }
  function corners(m){const u={x:m[0][0],y:m[0][1]},v={x:m[1][0],y:m[1][1]};return [{x:0,y:0},u,{x:u.x+v.x,y:u.y+v.y},v];}
  function arrow(a,b,color) {
    const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);if(len<1)return '';
    const ux=dx/len,uy=dy/len,head=Math.min(9,len*.35),bx=b.x-head*ux,by=b.y-head*uy;
    return `<path d="M${svgNum(a.x)},${svgNum(a.y)}L${svgNum(bx+ux*2)},${svgNum(by+uy*2)}" stroke="${color}" stroke-width="2.4" fill="none"/><path d="M${svgNum(b.x)},${svgNum(b.y)}L${svgNum(bx-uy*head*.4)},${svgNum(by+ux*head*.4)}L${svgNum(bx+ux*head*.4)},${svgNum(by-uy*head*.4)}Z" fill="${color}"/>`;
  }
  function drawRows(svg,matrix,name,W,H,camera) {
    const points=corners(matrix),map=pointMap(W,H,camera),p=points.map(map),o=p[0];
    const texts=['r₁','r₂'],tips=[p[1],p[3]],positions=labelPositions(tips,texts,o,W,H,p,[{x:10,y:7,w:35,h:40}]);
    let out=grid(W,H,camera,[...positions,{x:10,y:7,w:35,h:40}]);
    out+=`<path d="${path(points,map)}" fill="#c6f87916" stroke="#9fb88d90" stroke-width="1.2" stroke-linejoin="round"/>`;
    out+=`<path d="${path([points[1],points[2]],map,false)}" stroke="${C.violet}" stroke-opacity=".45" fill="none"/><path d="${path([points[3],points[2]],map,false)}" stroke="${C.cyan}" stroke-opacity=".45" fill="none"/>`;
    out+=arrow(o,p[1],C.cyan)+arrow(o,p[3],C.violet);
    positions.forEach((b,i)=>{out+=`<text x="${svgNum(b.x)}" y="${svgNum(b.y+b.h/2)}" dominant-baseline="central" font-size="12" fill="${i?C.violet:C.cyan}" stroke="${C.bg}" stroke-width="4" paint-order="stroke">${texts[i]}</text>`;});
    out+=`<circle cx="${svgNum(o.x)}" cy="${svgNum(o.y)}" r="3.1" fill="#dfeafb" stroke="${C.bg}" stroke-width="1.2"/>`;
    svg.setAttribute('aria-label',`Parallelogram ${name}: row 1 (${matrix[0].join(', ')}); row 2 (${matrix[1].join(', ')}).${name==='A'?' Area '+state.challenge.areaA+'.':''} Same coordinate scale as the other diagram.`);
    svg.innerHTML=out;
  }
  function draw() {
    const graphs=state.level===4?[$('graphA'),$('graphB')]:[$('graphA')];
    const sizes=graphs.map(svg=>{const r=svg.getBoundingClientRect(),W=Math.max(1,Math.round(r.width)),H=Math.max(1,Math.round(r.height));svg.setAttribute('viewBox',`0 0 ${W} ${H}`);return {W,H};});
    if(sizes.some(r=>r.W<40||r.H<40))return;
    if(state.level<4){if(state.polygon)drawPolygon(graphs[0],sizes[0].W,sizes[0].H);return;}
    if(!state.challenge)return;
    // Both diagrams share the camera: area comparisons never use different scales.
    const matrices=[state.challenge.A,state.challenge.B],all=matrices.flatMap(corners);
    const minX=Math.min(...all.map(p=>p.x)),maxX=Math.max(...all.map(p=>p.x)),minY=Math.min(...all.map(p=>p.y)),maxY=Math.max(...all.map(p=>p.y));
    const W=Math.min(...sizes.map(r=>r.W)),H=Math.min(...sizes.map(r=>r.H));
    const camera={x:(minX+maxX)/2,y:(minY+maxY)/2,scale:Math.min((W-96)/Math.max(3,maxX-minX),(H-100)/Math.max(3,maxY-minY))};
    camera.scale=Math.max(2,camera.scale);

  }
  function scheduleDraw(){cancelAnimationFrame(drawFrame);drawFrame=requestAnimationFrame(draw);}
  // Sound stays user-initiated; gain is capped, and unavailable audio is harmless.
  async function playTone(correct,magnitude=10) {
    if(!state.sound)return;
    try {
      const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;
      if(!audio)audio=new Audio();

      osc.onended=()=>{osc.disconnect();gain.disconnect();};
    } catch(_) { /* A browser without audio still has a fully playable game. */ }
  }
  function clearTimers(){timers.forEach(clearTimeout);timers=[];}
  function renderSound() {
    const icon=state.sound?'<path d="M11.5 6.5a5 5 0 0 1 0 7m2-9a8 8 0 0 1 0 11"/>':'<path d="m12 7 5 6m0-6-5 6"/>';
    $('sound').innerHTML=`<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h3l4-3v12l-4-3H3Z"/>${icon}</svg>`;
    $('sound').setAttribute('aria-pressed',String(state.sound));$('sound').title=state.sound?'Mute sound':'Enable sound';
  }
  NAMES.forEach((_,index)=>{
    const el=$('level'+(index+1));
    el.addEventListener('click',()=>{if(state.level!==index+1)startLevel(index+1);});
    el.addEventListener('keydown',e=>{
      let n=index;
      if(e.key==='ArrowRight')n=(index+1)%4;else if(e.key==='ArrowLeft')n=(index+3)%4;else if(e.key==='Home')n=0;else if(e.key==='End')n=3;else return;
      e.preventDefault();if(state.level!==n+1)startLevel(n+1);$('level'+(n+1)).focus({preventScroll:true});
    });
  });
  $('answerForm').addEventListener('submit',e=>{e.preventDefault();checkAnswer();});
  $('hintButton').addEventListener('click',showHint);$('hintClose').addEventListener('click',()=>closeHint(true));
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('hint').hidden){e.preventDefault();closeHint(true);}});
  document.addEventListener('pointerdown',e=>{if(!$('hint').hidden&&!$('hint').contains(e.target)&&!$('hintButton').contains(e.target))closeHint();});
  $('restart').addEventListener('click',()=>startLevel(state.level));$('replay').addEventListener('click',()=>startLevel(state.level));
  $('continue').addEventListener('click',()=>{startLevel(state.level<4?state.level+1:state.level);$('level'+state.level).focus({preventScroll:true});});
  $('sound').addEventListener('click',()=>{state.sound=!state.sound;clearTimers();renderSound();if(!state.sound&&audio)audio.suspend().catch(()=>{});});
  if('ResizeObserver' in window){const observer=new ResizeObserver(scheduleDraw);observer.observe($('paneA'));observer.observe($('paneB'));}
  window.addEventListener('resize',scheduleDraw);
  renderSound();startLevel(1);
})();
