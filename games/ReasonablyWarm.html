<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reasonably Warm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=Major+Mono+Display&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0418; --bg2:#1A0838; --panel:#0E0522; --line:#2C1859;
  --ink:#ECE2FF; --dim:#8E7DB9; --faint:#4B3A78;
  --cyan:#3CF2FF; --violet:#8C7BFF; --mag:#FF2BD6; --amber:#FFB13B; --red:#FF4D5E; --rock:#B65CFF;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0A0418;--panel:#0E0522;--ink:#ECE2FF}}
:root[data-theme="dark"]{--bg:#0A0418;--panel:#0E0522;--ink:#ECE2FF}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Chakra Petch','Rajdhani','Segoe UI',system-ui,sans-serif}
.app{display:flex;height:100%}
.field{position:relative;flex:1;min-width:0;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,var(--bg2) 0%,var(--bg) 70%)}
#game{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.flash{position:absolute;inset:0;pointer-events:none;opacity:0}
.rec{position:absolute;inset:0;pointer-events:none;display:none;box-shadow:inset 0 0 0 3px var(--mag),inset 0 0 60px rgba(255,43,214,.25)}
.rec svg{position:absolute;right:18px;top:16px;width:46px;height:26px}
.field.replay .rec{display:block;animation:recpulse 1.2s ease-in-out infinite}
.field.replay #game{cursor:pointer}
@keyframes recpulse{50%{opacity:.55}}
.inv .rec{box-shadow:inset 0 0 0 3px var(--mag),inset 0 0 60px rgba(227,18,44,.15)}
.flash.good{animation:flash 1.1s ease-out;background:radial-gradient(circle,rgba(255,177,59,.35),transparent 70%)}
.flash.boom{animation:flash .9s ease-out;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,177,59,.5) 30%,rgba(255,43,214,.3) 55%,transparent 80%)}
.inv .flash.boom{background:radial-gradient(circle,rgba(227,18,44,.55),rgba(0,0,0,.15) 45%,transparent 80%)}
#game.shake{animation:shake .55s cubic-bezier(.36,.07,.19,.97)}
#game.shake-big{animation:shake-big .9s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-6px,3px)}40%,60%{transform:translate(6px,-3px)}}
@keyframes shake-big{8%{transform:translate(-14px,8px) rotate(-.6deg)}16%{transform:translate(12px,-10px) rotate(.5deg)}26%{transform:translate(-10px,-6px)}36%{transform:translate(9px,7px) rotate(.3deg)}48%{transform:translate(-6px,4px)}60%{transform:translate(5px,-3px)}74%{transform:translate(-3px,2px)}88%{transform:translate(1px,-1px)}}
.flash.bad{animation:flash 1.1s ease-out;background:radial-gradient(circle,rgba(255,77,94,.4),transparent 70%)}
@keyframes flash{0%{opacity:1}100%{opacity:0}}

.g1{stroke:var(--cyan);stroke-opacity:.07;stroke-width:1}
.g5{stroke:var(--cyan);stroke-opacity:.16;stroke-width:1}
.ax{stroke:var(--cyan);stroke-opacity:.42;stroke-width:1.2}
.tick{fill:var(--cyan);fill-opacity:.45;font:500 10px 'Chakra Petch',sans-serif}
.wl{stroke:var(--mag);stroke-opacity:.10;stroke-width:1}
.wl5{stroke:var(--mag);stroke-opacity:.26;stroke-width:1}
.se{stroke:#C9B8FF;stroke-opacity:.10;stroke-width:.8}
.sd{fill:#E6DCFF}
.rock{fill:rgba(182,92,255,.10);stroke:var(--rock);stroke-width:1.6;stroke-linejoin:round}
.fan{stroke:var(--rock);stroke-opacity:.35;stroke-width:.8}
.halo{fill:none;stroke:var(--rock);stroke-opacity:.35;stroke-width:1;stroke-dasharray:3 5}
.trail{fill:none;stroke:var(--cyan);stroke-opacity:.55;stroke-width:1.5;stroke-dasharray:6 4}
.trailpt{fill:var(--bg);stroke:var(--cyan);stroke-width:1.5}
.tgt{fill:rgba(255,177,59,.10);stroke:var(--amber);stroke-width:2}
.tgt2{fill:none;stroke:var(--amber);stroke-opacity:.5;stroke-width:1;stroke-dasharray:2 6}
.tgtx{stroke:var(--amber);stroke-width:1.2;stroke-opacity:.8}
.range{fill:none;stroke:var(--amber);stroke-opacity:.22;stroke-width:1;stroke-dasharray:4 6}
.path{stroke:var(--amber);stroke-width:2;stroke-dasharray:8 6}
.path.hot{stroke:var(--red)}
.pivot circle{fill:none;stroke:var(--violet);stroke-width:1.5;stroke-dasharray:3 3}
.pivot line{stroke:var(--violet);stroke-width:1.2}
.para{fill:rgba(255,177,59,.07);stroke:var(--amber);stroke-opacity:.6;stroke-width:1}
.a1{stroke:var(--violet);fill:var(--violet);stroke-width:2.2}
.a2{stroke:var(--cyan);fill:var(--cyan);stroke-width:2.2}
.ghost{fill:rgba(60,242,255,.06);stroke-width:1.5;stroke-dasharray:4 3;stroke-opacity:.9}
.ghost.win{stroke:var(--amber)!important;fill:rgba(255,177,59,.18)}
.ghost.bad{stroke:var(--red)!important}
.stopo{fill:none;stroke:var(--red);stroke-width:2}
.fieldout{fill:rgba(255,43,214,.08)}
.fieldglow{fill:none;stroke:var(--mag);stroke-opacity:.22;stroke-width:18;stroke-linejoin:miter}
.fieldhex{fill:none;stroke:var(--mag);stroke-opacity:.5;stroke-width:7;stroke-dasharray:1 9;stroke-linecap:round;animation:fieldflow 2.4s linear infinite reverse}
.fieldline{fill:none;stroke:var(--mag);stroke-width:2.2;stroke-dasharray:14 7;animation:fieldflow 1.1s linear infinite}
@keyframes fieldflow{to{stroke-dashoffset:-42}}
.inv .fieldout{fill:rgba(227,18,44,.06)}
@media (prefers-reduced-motion:reduce){.fieldline,.fieldhex{animation:none}}
.anchor{fill:none;stroke:var(--amber);stroke-width:1.6;stroke-dasharray:2 5;opacity:.75}
.mbody{fill:var(--ink);stroke:var(--cyan);stroke-width:1.2;stroke-linejoin:round}
.mfin{fill:var(--cyan)}
.mband{stroke:var(--mag);stroke-width:1.4}
.mjet{fill:var(--mag);transform-box:fill-box;transform-origin:100% 50%;animation:jetflick .09s infinite alternate}
.mjetcore{fill:#FFFFFF;opacity:.85;transform-box:fill-box;transform-origin:100% 50%;animation:jetflick .07s infinite alternate}
.inv .mbody{fill:#0A0A0A;stroke:#0A0A0A}
.inv .mfin{fill:#0A0A0A}
.inv .mjetcore{fill:#FFD0D6}
@media (prefers-reduced-motion:reduce){.mjet,.mjetcore{animation:none}}
.aim{stroke:var(--mag);stroke-width:1.2;stroke-dasharray:3 6;stroke-opacity:.55}
.aim.ghostaim{stroke-opacity:.85;stroke-dasharray:6 5}
.enemy{fill:rgba(255,43,214,.12);stroke:var(--mag);stroke-width:2;stroke-linejoin:round}
.orbitfx{animation:spin 3.2s linear infinite}
.stalkfx{transform-box:fill-box;transform-origin:center;animation:stalkin 1.4s cubic-bezier(.5,0,.9,.6) infinite}
@keyframes stalkin{0%{transform:scale(1.9);opacity:0}35%{opacity:.85}100%{transform:scale(.95);opacity:0}}
.ereticle{fill:none;stroke:var(--mag);stroke-opacity:.6;stroke-width:1;stroke-dasharray:2 4;transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite}
.missile{fill:#fff}
.mtrail{stroke:var(--mag);stroke-width:2.5;stroke-linecap:round}
.spark{fill:var(--mag)}
.ebullet{fill:var(--mag)}
.pm{fill:var(--ink)}
.pmtrail{stroke:var(--ink);stroke-width:1.4;stroke-dasharray:3 4;stroke-opacity:.7}
.killx{stroke:var(--ink);stroke-width:2}
.btrail{stroke:var(--mag);stroke-width:1.4;stroke-dasharray:3 4;stroke-opacity:.75}
.fpath{stroke:var(--mag);stroke-opacity:.35;stroke-width:1;stroke-dasharray:2 4}
.foeghost{fill:none;stroke:var(--mag);stroke-opacity:.45;stroke-width:1.2;stroke-dasharray:3 3}
.loaded{fill:none;stroke:var(--mag);stroke-width:1.5;stroke-dasharray:4 3}
.matrix.l5 .cell.c1 input{opacity:.45;pointer-events:none}
body.inv{--bg:#FFFFFF;--bg2:#FFFFFF;--panel:#FFFFFF;--line:#D6D6D6;--ink:#0A0A0A;--dim:#666;--faint:#C2C2C2;
  --cyan:#0A0A0A;--violet:#8A8A8A;--mag:#E3122C;--amber:#0A0A0A;--red:#E3122C;--rock:#555;color-scheme:light}
.inv .ship{fill:#0A0A0A}
.inv #shipL circle{fill:#FFFFFF!important}
.inv .sd{fill:#A0A0A0}
.inv .se{stroke:#8A8A8A}
.inv .para{fill:rgba(0,0,0,.05)}
.inv .mtrail{stroke:#0A0A0A}
.inv .missile{fill:#0A0A0A}
.inv .trailpt{fill:#FFFFFF}
.inv .enemy{fill:rgba(227,18,44,.14)}
.inv .matrix::before,.inv .matrix::after{box-shadow:none}
.inv .cell.c1 input{border-bottom-color:#9A9A9A}
.inv .cell.c2 input,.inv .cell.c3 input{border-bottom-color:#0A0A0A}
.inv .cell input:focus-visible{box-shadow:0 0 0 1px #0A0A0A}
.inv .go .gohex{fill:rgba(0,0,0,.05)}
.inv .go:not(:disabled):hover svg{filter:drop-shadow(0 0 6px rgba(0,0,0,.35))}
.inv .fire .fhex{fill:rgba(227,18,44,.08)}
.inv .fire:not(:disabled):hover svg{filter:drop-shadow(0 0 8px rgba(227,18,44,.5))}
.hitx{stroke:var(--red);stroke-width:2.5}
.ship{fill:#14062E;stroke:var(--cyan);stroke-width:2.2;stroke-linejoin:round}
.flame{fill:var(--mag);transform-box:fill-box;transform-origin:50% 0%;animation:flick .11s infinite alternate}
.jet{fill:var(--mag);transform-box:fill-box;transform-origin:0% 50%;animation:jetflick .09s infinite alternate}
.jetcore{fill:#FFFFFF;opacity:.85;transform-box:fill-box;transform-origin:0% 50%;animation:jetflick .07s infinite alternate}
.nozzle{fill:#14062E;stroke:var(--cyan);stroke-width:1.2}
.cannon{fill:#14062E;stroke:var(--cyan);stroke-width:1.6}
.hullfan{stroke:var(--cyan);stroke-opacity:.35;stroke-width:1}
.inv .nozzle,.inv .cannon{fill:#0A0A0A}
.inv .jetcore{fill:#FFD0D6}
.coremark{fill:var(--cyan)}
.vent{fill:var(--cyan)}
.inv .coremark{fill:#FFFFFF}
.inv #shipL g[filter]{filter:none}
.inv .hullfan{stroke:#FFFFFF;stroke-opacity:.55}
.inv .hullinner{stroke:#FFFFFF!important;stroke-opacity:.8!important}
.hexring{fill:none;stroke:var(--cyan);stroke-opacity:.45;stroke-width:1;stroke-dasharray:3 4;transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
.hexpulse{transform-box:fill-box;transform-origin:center}
#shipL.docked .hexpulse{animation:dockpulse 1.1s ease-in-out infinite}
#shipL.docked .hexring{stroke:var(--amber);stroke-opacity:.9;stroke-width:1.6;animation-duration:2.4s}
@keyframes dockpulse{0%,100%{transform:scale(.9)}50%{transform:scale(1.22)}}
@media (prefers-reduced-motion:reduce){#shipL.docked .hexpulse{animation:none}}
#shipL.docked .ship,#shipL.docked .nozzle,#shipL.docked .cannon{stroke:var(--amber)}
#shipL.docked .hullfan,#shipL.docked .hullinner{stroke:var(--amber)!important}
#shipL.docked circle{fill:var(--amber)!important}
.offarrow{fill:var(--amber)}
.cur{stroke:var(--ink);stroke-opacity:.5;stroke-width:1}
.hidden{display:none}
@keyframes flick{from{transform:scaleY(.65)}to{transform:scaleY(1.15)}}
@keyframes jetflick{from{transform:scaleX(.72)}to{transform:scaleX(1.12)}}
@keyframes spin{to{transform:rotate(360deg)}}
.boom-ring{fill:none;stroke:var(--red);stroke-width:3;animation:ring 1s ease-out forwards}
.boom-ring.good{stroke:var(--amber)}
.boom-shard{stroke:var(--amber);stroke-width:2.5;stroke-linecap:round;animation:shard 1s ease-out forwards}
@keyframes ring{from{r:4;opacity:1}to{r:140;opacity:0}}
@keyframes shard{from{opacity:1;stroke-dashoffset:0}to{opacity:0;stroke-dashoffset:-60}}

.panel{width:340px;flex:none;border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;
  padding:28px 26px;display:flex;flex-direction:column;justify-content:center;gap:34px}
#prog{width:100%;height:auto;display:block}
.lv{cursor:pointer}
.lv.locked{cursor:default}
.lv:focus-visible{outline:none}
.lv:focus-visible .lvhex{stroke:var(--ink)}
.matrix{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:8px 10px;padding:12px 22px}
.matrix::before,.matrix::after{content:"";position:absolute;top:0;bottom:0;width:14px;border:2px solid var(--cyan);
  box-shadow:0 0 8px rgba(60,242,255,.6),inset 0 0 6px rgba(60,242,255,.25)}
.matrix::before{left:0;border-right:none}
.matrix::after{right:0;border-left:none}
.cell input,.cell .fixed{width:100%;background:rgba(255,255,255,.02);border:1px solid var(--line);color:var(--ink);
  font:600 22px 'Chakra Petch',sans-serif;font-variant-numeric:tabular-nums;text-align:center;padding:12px 4px;border-radius:3px}
.cell .fixed{color:var(--faint);border-color:transparent;background:none}
.cell.c1 input{border-bottom:2px solid rgba(140,123,255,.6)}
.cell.c2 input{border-bottom:2px solid rgba(60,242,255,.6)}
.cell.c3 input{border-bottom:2px solid rgba(255,177,59,.65)}
.cell input:focus-visible{outline:none;border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 14px rgba(60,242,255,.35)}
.cell.bad input{border-color:var(--red);color:var(--red)}
.bmat{position:relative;display:grid;gap:2px 10px;padding:6px 18px;margin:-16px 36px 0;font:600 15px 'Chakra Petch',sans-serif;
  font-variant-numeric:tabular-nums;color:var(--mag);text-align:center}
.bmat.hidden{display:none}
.bmat::before,.bmat::after{content:"";position:absolute;top:0;bottom:0;width:10px;border:2px solid var(--mag);box-shadow:0 0 8px rgba(255,43,214,.5)}
.bmat::before{left:0;border-right:none}.bmat::after{right:0;border-left:none}
.bmat span{padding:3px 0}
.bwall{fill:none;stroke-linecap:round;opacity:.9}
.bhull{fill:rgba(255,43,214,.10);stroke:var(--mag);stroke-width:3;stroke-linejoin:round}
.bgrid{stroke:var(--mag);stroke-opacity:.35;stroke-width:1}
.laser{stroke:#FF4D5E;stroke-opacity:.75;stroke-linecap:round}
.laserwarn{stroke:#FF4D5E;stroke-width:1.5;stroke-dasharray:6 6;stroke-opacity:.7}
.bstorm{fill:none;stroke:#8C7BFF;stroke-opacity:.35;stroke-width:1.2;stroke-dasharray:4 5}
.blat{stroke:#7CFF9E;stroke-opacity:.35;stroke-width:1.2}
.bstud{fill:rgba(124,255,158,.25);stroke:#7CFF9E;stroke-width:1.2}
.baxis{stroke:#CFE8FF;stroke-opacity:.35;stroke-width:1.2;stroke-dasharray:10 6}
.bwing{fill:rgba(207,232,255,.10);stroke:#CFE8FF;stroke-width:2.5;stroke-linejoin:round}
.bdrone{fill:none;stroke:#CFE8FF;stroke-width:1.5;stroke-dasharray:3 3;opacity:.8}
.wkoct{fill:rgba(255,177,59,.25);stroke:#FFB13B;stroke-width:2.2}
.wkcore{fill:#FFFFFF}
.wkring{fill:none;stroke:#FFB13B;stroke-width:1.2;stroke-dasharray:3 5;transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}
.jrow{width:100%;height:18px;display:block}
.gas{display:flex;align-items:center;gap:12px}
.gas.hidden{display:none}
.gas svg{width:22px;height:22px;flex:none}
.gbar{position:relative;flex:1;height:14px;border:1px solid var(--line);overflow:hidden;border-radius:2px}
.gbar.short{border-color:var(--red);box-shadow:0 0 10px rgba(255,77,94,.5)}
.gfill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--mag),var(--amber));box-shadow:0 0 12px rgba(255,43,214,.5);transition:width .35s}
.gcost{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(10,4,24,.85) 0 4px,rgba(10,4,24,.35) 4px 8px)}
.btns{display:flex;justify-content:center;gap:22px}
.restart{width:56px;height:56px;align-self:center;border:none;background:none;padding:0;cursor:pointer}
.restart svg{width:100%;height:100%;display:block}
.restart .rhex{fill:none;stroke:var(--dim);stroke-width:2.4}
.restart .rarc{fill:none;stroke:var(--dim);stroke-width:4;stroke-linecap:round}
.restart .rtip{fill:var(--dim)}
.restart:hover .rhex,.restart:hover .rarc{stroke:var(--cyan)}
.restart:hover .rtip{fill:var(--cyan)}
.restart:hover svg{filter:drop-shadow(0 0 8px rgba(60,242,255,.6))}
.restart:focus-visible{outline:2px solid var(--cyan);outline-offset:4px}
.fire{width:72px;height:72px;border:none;background:none;padding:0;cursor:pointer}
.fire.hidden{display:none}
.fire svg{width:100%;height:100%;display:block}
.fire .fhex{fill:rgba(255,43,214,.15);stroke:var(--mag);stroke-width:2}
.fire .fm{fill:var(--mag)}
.fire:not(:disabled):hover svg{filter:drop-shadow(0 0 10px rgba(255,43,214,.75))}
.fire:disabled{cursor:not-allowed}
.fire:disabled .fhex{fill:none;stroke:var(--faint)}
.fire:disabled .fm{fill:var(--faint)}
.fire:focus-visible{outline:2px solid var(--cyan);outline-offset:4px}
.go{width:72px;height:72px;border:none;background:none;padding:0;cursor:pointer}
.go svg{width:100%;height:100%;display:block}
.go .gohex{fill:rgba(255,177,59,.15);stroke:var(--amber);stroke-width:2}
.go .gotri{fill:var(--amber)}
.go:not(:disabled):hover svg{filter:drop-shadow(0 0 10px rgba(255,177,59,.7))}
.go:disabled{cursor:not-allowed}
.go:disabled .gohex{fill:none;stroke:var(--faint)}
.go:disabled .gotri{fill:var(--faint)}
.go:focus-visible{outline:2px solid var(--cyan);outline-offset:4px}
@media (max-width:780px){
  .app{flex-direction:column;height:auto;min-height:100%}
  .field{height:60vh;flex:none}
  .panel{width:auto;border-left:none;border-top:1px solid var(--line);gap:22px}
}
/* title screen */
.title{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,4vh,40px);
  padding:env(safe-area-inset-top,0px) 20px env(safe-area-inset-bottom,0px);background:radial-gradient(ellipse at 50% 45%,#1E0A42 0%,#0A0418 72%);
  transition:opacity .7s ease,visibility .7s;color-scheme:dark}
.title.gone{opacity:0;visibility:hidden}
.title::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(60,242,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(60,242,255,.07) 1px,transparent 1px);
  background-size:46px 46px;background-position:center;-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%)}
.tname{position:relative;margin:0;text-align:center;font-family:'Major Mono Display','Courier New',monospace;font-weight:400;
  font-size:clamp(38px,8.5vw,116px);line-height:1.05;color:#FFFFFF;letter-spacing:.02em}
.tname .r{text-shadow:0 0 5px #3CF2FF,0 0 22px rgba(60,242,255,.65)}
.tname .h{color:#FFE9F9;text-shadow:0 0 6px #FF2BD6,0 0 24px #FF2BD6,0 0 52px rgba(255,177,59,.65);animation:neon 5s infinite}
@keyframes neon{0%,17%,21%,63%,66%,100%{opacity:1}19%,64.5%{opacity:.3}}
.tship{position:relative;width:clamp(120px,17vw,180px);height:auto;overflow:visible;animation:bob 3.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.tship .tcore{transform-box:fill-box;transform-origin:center;animation:spin 7s linear infinite}
.tship .jet{fill:#FF2BD6;transform-box:fill-box;transform-origin:0% 50%;animation:jetflick .09s infinite alternate}
.tstart{position:relative;width:84px;height:84px;border:none;background:none;padding:0;cursor:pointer}
.tstart svg{width:100%;height:100%;display:block}
.tstart .gohex{fill:rgba(255,177,59,.15);stroke:#FFB13B;stroke-width:2}
.tstart .gotri{fill:#FFB13B}
.tstart:hover svg{filter:drop-shadow(0 0 12px rgba(255,177,59,.8))}
.tstart:focus-visible{outline:none}
.tstart:focus-visible svg{filter:drop-shadow(0 0 10px rgba(60,242,255,.9))}
@media (prefers-reduced-motion:reduce){.tname .h,.tship,.tship .tcore{animation:none}.title{transition:none}}
@media (prefers-reduced-motion:reduce){.jet,.jetcore{animation:none}.orbitfx,.stalkfx{animation:none}#game.shake,#game.shake-big{animation:none}.field.replay .rec{animation:none}.flame,.hexring{animation:none}.gfill{transition:none}}
</style>
</head>
<body>
<div class="title" id="title" role="dialog" aria-label="Reasonably Warm">
  <h1 class="tname"><span class="r">Reasonably</span> <span class="h">Warm</span></h1>
  <svg class="tship" id="tship" viewBox="-70 -78 140 170" aria-hidden="true"></svg>
  <button class="tstart" id="tstart" aria-label="Start"><svg viewBox="0 0 72 72"><polygon class="gohex" points="36,3 65,19.5 65,52.5 36,69 7,52.5 7,19.5"/><polygon class="gotri" points="29,24 49,36 29,48"/></svg></button>
</div>
<div class="app">
  <main class="field" id="field">
    <svg id="game" aria-label="Play field" role="img">
      <defs>

<script>
(function(){
'use strict';
const D2R=Math.PI/180;
const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- affine algebra: x' = a x + b y + c ; y' = d x + e y + f ---------- */
const I={a:1,b:0,c:0,d:0,e:1,f:0};
const mul=(P,Q)=>({a:P.a*Q.a+P.b*Q.d,b:P.a*Q.b+P.b*Q.e,c:P.a*Q.c+P.b*Q.f+P.c,
                   d:P.d*Q.a+P.e*Q.d,e:P.d*Q.b+P.e*Q.e,f:P.d*Q.c+P.e*Q.f+P.f});
const det=M=>M.a*M.e-M.b*M.d;

const add=(p,q)=>[p[0]+q[0],p[1]+q[1]];

/* ---------- the true continuous motion: M^t = exp(t log M) ----------
   For [A | c] with A = R a rotation, every point moves on a circle about the fixed point p = (I - A)^-1 c. */
function logm2(a,b,d,e){

    return {a:lr+k*(a-h),b:k*b,d:k*d,e:lr+k*(e-h)}}

    const L1=Math.log(l1),L2=Math.log(l2),den=l1-l2;

}
function expm2(K,t){
  const h=(K.a+K.e)/2,ma=K.a-h,me=K.e-h,q=ma*ma+K.b*K.d;let C,Sn;
  if(q>1e-14){const r=Math.sqrt(q);C=Math.cosh(t*r);Sn=Math.sinh(t*r)/r}
  else if(q<-1e-14){const r=Math.sqrt(-q);C=Math.cos(t*r);Sn=Math.sin(t*r)/r}
  else{C=1;Sn=t}

}
function makeFlow(M){
  const K=logm2(M.a,M.b,M.d,M.e);if(!K)return null;
  const N=24,Jt=t=>{let A=0,B=0,Dd=0,E=0;const h=t/N;
    for(let i=0;i<=N;i++){const w=(i===0||i===N)?1:(i%2?4:2),X=expm2(K,i*h);A+=w*X.a;B+=w*X.b;Dd+=w*X.d;E+=w*X.e}
    const k=h/3;return {a:A*k,b:B*k,d:Dd*k,e:E*k}};
  const J1=Jt(1),dj=J1.a*J1.e-J1.b*J1.d;if(Math.abs(dj)<1e-9)return null;
  const u=[(J1.e*M.c-J1.b*M.f)/dj,(-J1.d*M.c+J1.a*M.f)/dj];
  return t=>{if(t<=0)return I;const X=expm2(K,t),J=Jt(t);return {a:X.a,b:X.b,c:J.a*u[0]+J.b*u[1],d:X.d,e:X.e,f:J.d*u[0]+J.e*u[1]}};
}
let flowM=null,flowFn=null;
/* a jump: the ship's heading turns smoothly by the rotation in columns 1-2 while it travels
   in a straight line to the point in column 3 */
function lerpFrame(M,t){return lerpSplit(M,t)}
/* fallback for matrices with no continuous path (e.g. mirror flips): turn the axes and slide the origin */
function lerpSplit(M,t){
  const th=Math.atan2(M.d,M.a),co=Math.cos(th),si=Math.sin(th);
  const s00=co*M.a+si*M.d,s01=co*M.b+si*M.e,s10=-si*M.a+co*M.d,s11=-si*M.b+co*M.e;
  const k00=1-t+t*s00,k01=t*s01,k10=t*s10,k11=1-t+t*s11;
  const c2=Math.cos(th*t),s2=Math.sin(th*t);

}

/* ---------- expression evaluator (degrees) ---------- */
function evalExpr(raw){
  const s=String(raw).replace(/[−–]/g,'-').replace(/×/g,'*').replace(/÷/g,'/').replace(/°/g,'').replace(/\s+/g,'').toLowerCase();
  if(!s)throw 0;let i=0;
  const FN={sin:x=>Math.sin(x*D2R),cos:x=>Math.cos(x*D2R),tan:x=>Math.tan(x*D2R),sqrt:Math.sqrt,abs:Math.abs};
  function expr(){let v=term();while(s[i]==='+'||s[i]==='-'){const o=s[i++];const r=term();v=o==='+'?v+r:v-r}return v}
  function term(){let v=unary();while(true){if(s[i]==='*'||s[i]==='/'){const o=s[i++];const r=unary();v=o==='*'?v*r:v/r}
    else if(i<s.length&&/[a-zπ(]/.test(s[i])){v*=unary()}else break}return v}
  function unary(){if(s[i]==='-'){i++;return -unary()}if(s[i]==='+'){i++;return unary()}return power()}
  function power(){const b=primary();if(s[i]==='^'){i++;return Math.pow(b,unary())}return b}
  function primary(){
    if(s[i]==='('){i++;const v=expr();if(s[i]!==')')throw 0;i++;return v}
    if(s[i]==='π'){i++;return Math.PI}
    const id=/^[a-z]+/.exec(s.slice(i));
    if(id){i+=id[0].length;const n=id[0];if(n==='pi')return Math.PI;const f=FN[n];if(!f||s[i]!=='(')throw 0;i++;const v=expr();if(s[i]!==')')throw 0;i++;return f(v)}
    const m=/^(\d+\.?\d*|\.\d+)(e[+-]?\d+)?/.exec(s.slice(i));if(!m)throw 0;i+=m[0].length;return parseFloat(m[0]);
  }
  const v=expr();if(i!==s.length)throw 0;return v;
}

/* ---------- scenery ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const stars=[],starEdges=[];
(function(){const r=rng(11);for(let i=0;i<200;i++)stars.push([(r()*2-1)*36,(r()*2-1)*36,0.6+r()*1.4]);
  const seen=new Set();
  for(let i=0;i<stars.length;i++){const ds=[];for(let j=0;j<stars.length;j++)if(j!==i)ds.push([Math.hypot(stars[i][0]-stars[j][0],stars[i][1]-stars[j][1]),j]);
    ds.sort((x,y)=>x[0]-y[0]);for(let k=0;k<2;k++){const j=ds[k][1];const key=i<j?i+'-'+j:j+'-'+i;if(!seen.has(key)){seen.add(key);starEdges.push([i,j])}}}})();

/* ---------- geometry for obstacles ---------- */
const CLEAR=0.35;
function segHit(P0,P1,rocks){
  let best=null;const dx=P1[0]-P0[0],dy=P1[1]-P0[1];
  for(const [cx,cy,r] of rocks){
    const R=r+CLEAR,fx=P0[0]-cx,fy=P0[1]-cy,A=dx*dx+dy*dy,B=2*(fx*dx+fy*dy),C=fx*fx+fy*fy-R*R;
    if(C<0){best=0;continue}if(A<1e-12)continue;const disc=B*B-4*A*C;if(disc<0)continue;
    const s=(-B-Math.sqrt(disc))/(2*A);if(s>=0&&s<=1&&(best===null||s<best))best=s;
  }return best;
}
/* shortest obstacle-free route: visibility graph over polygons circumscribing each clearance circle */
function shortestRoute(start,goal,rocks){
  const N=12,nodes=[start,goal];
  rocks.forEach(([cx,cy,r])=>{const R=(r+CLEAR)/Math.cos(Math.PI/N)+0.08;
    for(let k=0;k<N;k++){const a=k/N*2*Math.PI;const p=[cx+R*Math.cos(a),cy+R*Math.sin(a)];
      if(rocks.every(([x,y,rr])=>Math.hypot(p[0]-x,p[1]-y)>rr+CLEAR+1e-3))nodes.push(p)}});
  const n=nodes.length,dist=new Array(n).fill(Infinity),prev=new Array(n).fill(-1),done=new Array(n).fill(false);dist[0]=0;
  for(let it=0;it<n;it++){let u=-1;for(let v=0;v<n;v++)if(!done[v]&&(u<0||dist[v]<dist[u]))u=v;
    if(u<0||dist[u]===Infinity)break;done[u]=true;if(u===1)break;
    for(let v=0;v<n;v++){if(done[v])continue;const w=Math.hypot(nodes[u][0]-nodes[v][0],nodes[u][1]-nodes[v][1]);
      if(dist[u]+w<dist[v]&&segHit(nodes[u],nodes[v],rocks)===null){dist[v]=dist[u]+w;prev[v]=u}}}
  if(dist[1]===Infinity)return null;let segs=0;for(let v=1;prev[v]>=0;v=prev[v])segs++;
  return {len:dist[1],segs};
}

/* ---------- random level generation ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a);
const FAR=30, MNEAR=.42, ARENA=30, TYPES=9, BOSS0=6, UNLOCK=3, BSPD=2.4, BLIFE=9, HULL5=0.45, BR=0.15;
function genDuel(type){
  const n=type-2,foes=[];let g=0;
  while(foes.length<n&&g++<800){
    const x=Math.round(rnd(-7,7)),y=Math.round(rnd(-7,7)),d=Math.hypot(x,y);
    if(d<4||d>8||(x===0&&y>0))continue;const a=Math.atan2(y,x);
    if(foes.some(f=>{let da=Math.abs(Math.atan2(f.w[1],f.w[0])-a);da=Math.min(da,2*Math.PI-da);return da<0.7}))continue;
    foes.push({w:[x,y],r:0.5,cd:Math.floor(Math.random()*3),strat:STRATS[Math.floor(Math.random()*STRATS.length)],spin:Math.random()<.5?1:-1});
  }
  return {type,F0:I,target:[0,0],tr:0,heading:null,jumps:Infinity,gas:null,rocks:[],foes};
}
const isDuel=()=>!!L&&L.type>=3&&L.type<BOSS0, isBoss=()=>!!L&&L.type>=BOSS0;
function genLevel(type){
  if(type>=BOSS0)return {type,F0:I,target:[0,0],tr:0,heading:null,jumps:Infinity,gas:null,rocks:[],fieldK:2+Math.random()};   // level 8: field strength drawn from [2, 3] for each new layout
  if(type>=3)return genDuel(type);
  for(let tries=0;tries<500;tries++){
    const F0=I;
    const near=type<2,lo=near?3:(type===2?8:9),hi=near?7.5:(type===2?12:14);
    const ang=rnd(0,2*Math.PI),d0=rnd(lo,hi);const T=[Math.round(d0*Math.cos(ang)),Math.round(d0*Math.sin(ang))];
    const dist=Math.hypot(T[0],T[1]);if(dist<lo||dist>hi)continue;
    const tr=type<2?0.6:0.8;
    let heading=null,rocks=[];
    if(type>=2){
      const ux=T[0]/dist,uy=T[1]/dist,px=-uy,py=ux;
      const ok=(c,r)=>Math.hypot(c[0],c[1])>r+CLEAR+1.1&&Math.hypot(c[0]-T[0],c[1]-T[1])>r+CLEAR+tr+0.6&&
        rocks.every(([x,y,rr])=>Math.hypot(c[0]-x,c[1]-y)>r+rr+0.4);
      const nBlock=type===2?(Math.random()<.4?2:1):2,nScatter=type===2?3+Math.floor(Math.random()*3):5+Math.floor(Math.random()*4);
      for(let i=0,g=0;i<nBlock&&g<60;g++){const s=rnd(.3,.7),o=rnd(-.5,.5),r=rnd(1,1.8);const c=[T[0]*s+px*o,T[1]*s+py*o];if(ok(c,r)){rocks.push([c[0],c[1],r]);i++}}
      for(let i=0,g=0;i<nScatter&&g<80;g++){const s=rnd(-.1,1.1),o=rnd(-5.5,5.5),r=rnd(.7,1.6);const c=[T[0]*s+px*o,T[1]*s+py*o];if(ok(c,r)){rocks.push([c[0],c[1],r]);i++}}

    }

      jumps=type===2?Math.max(3,sp.segs+1):sp.segs+2;if(type===3)gas=sp.len*1.2+1.5}
    const toW=p=>ap(F0,p);

  }
  return genLevel(Math.max(0,type-1));
}
function rockPolys(){
  L.polys=L.rocks.map(([x,y,r])=>{const n=7+Math.floor(Math.random()*3);const ps=[];
    for(let j=0;j<n;j++){const a=j/n*2*Math.PI+(Math.random()-.5)*.5;const rr=r*(.78+Math.random()*.22);ps.push([x+Math.cos(a)*rr,y+Math.sin(a)*rr])}return ps});
}

/* ---------- progress (kept in this browser) ---------- */
let prog={cleared:[0,0,0,0,0,0],type:0};
try{const v3=JSON.parse(localStorage.getItem('rh-progress-v3')||'null'),sv=JSON.parse(localStorage.getItem('rh-progress-v2')||'null');
  if(v3&&Array.isArray(v3.cleared))prog=v3;
  else if(sv&&Array.isArray(sv.cleared)){const c=sv.cleared,keep=[0,1,2,3,4,5,6,8,10],t=sv.type|0;
    prog={cleared:keep.map(i=>c[i]||0),type:t<6?t:{6:6,7:6,8:7,9:7,10:8}[t]||0}}
  else{const old=JSON.parse(localStorage.getItem('rh-progress')||'null');
    if(old&&Array.isArray(old.cleared)){const c=old.cleared.slice();c.splice(3,1);const t=old.type|0;prog={cleared:c.slice(0,6),type:t<3?t:t===3?2:t-1}}}}catch(e){}

if(!(prog.type>=0&&prog.type<TYPES))prog.type=0;
const saveProg=()=>{try{localStorage.setItem('rh-progress-v3',JSON.stringify(prog))}catch(e){}};
const unlocked=t=>t<BOSS0||prog.cleared.slice(0,BOSS0).every(n=>n>0);   // bosses open once levels 1-6 have each been beaten

/* ---------- state ---------- */
/* the ship: a regular octagon (circumradius RC, flat side facing each of the 8 directions),
   a thruster on every side, twin cannons on the front face */
const RC=0.4,RIN=RC*Math.cos(Math.PI/8),CANX=0.12,CANL=0.3;
const OCT=[...Array(8)].map((_,k)=>{const a=(22.5+45*k)*D2R;return [RC*Math.cos(a),RC*Math.sin(a)]});
const SHIP=[OCT[0],OCT[1],[CANX,RIN],[CANX,RIN+CANL],[-CANX,RIN+CANL],[-CANX,RIN],...OCT.slice(2)];
let L,F=I,G=I,used=0,gas=0,trail=[],state='plan',cur=null,live=null,dead=false,stalled=false;

const MISSILES=3;
let foes=[],bullets=[],pmiss=[],plan5=null,tickT=null,maxMissiles=MISSILES;
const MSPD=3;
/* replay: every action is logged; level randomness comes from a per-level seed so the run replays exactly */
let trailArc=[[0,0]],liveArc=[];
let replaying=false,log=[],replayTimer=null,epoch=0,lr=Math.random;
let W=800,H=600,U=40;
const $=id=>document.getElementById(id);
const svg=$('game'),bgL=$('bgL'),worldL=$('worldL'),prevL=$('prevL'),shipL=$('shipL'),fxL=$('fxL'),curL=$('curL'),progEl=$('prog');
const inputs={};'abcdef'.split('').forEach(k=>inputs[k]=$('m-'+k));

const S=p=>[p[0]*U,-p[1]*U];
const n1=v=>(Math.abs(v)<1e-9?0:v);
function fmt(v,d=1){let s=n1(Math.round(v*10**d)/10**d).toFixed(d);if(s.startsWith('-'))s='−'+s.slice(1);return s}
function plain(v,d=1){return String(n1(Math.round(v*10**d)/10**d))}
function pts(arr){return arr.map(p=>{const q=S(p);return q[0].toFixed(1)+','+q[1].toFixed(1)}).join(' ')}
const W2S=p=>ap(G,p);
function circlePts(c,r,n=44){const out=[];for(let i=0;i<n;i++){const a=i/n*2*Math.PI;out.push(W2S([c[0]+r*Math.cos(a),c[1]+r*Math.sin(a)]))}return out}

const pathHit=(P0,P1)=>segHit(P0,P1,L.rocks);

function sigmaMax(M){const p=M.a*M.a+M.d*M.d,q=M.b*M.b+M.e*M.e,r=M.a*M.b+M.d*M.e;
  return Math.sqrt((p+q)/2+Math.sqrt(((p-q)/2)**2+r*r))}
/* level 5: everything moves one tick per jump. Plan the tick, then test the jump against it */
/* each enemy keeps one rule for the whole level; every rule is defined relative to you

/* ---- 7. The Gyre: three armoured rings turning at 90, -45 and 30 degrees per tick ---- */

/* ---- 8. The Eigenstorm: a linear vector field  dp/dt = s k A (p - c)  carries one fixed set of bullets ----

   c is the centre of the ellipses (the midpoint of their foci). The field lives in the world, so your turning
   never affects it. Every bullet's position is c + exp(f A)(p_start - c), where f is the field time; a jump
   advances f by s k. The field flips to a sink the instant the outermost ring touches the force field, and back

let fieldK=2.5;

  const seg=(q,v,Kx,t)=>{const X=expm2(Kx,t),J=Jint(Kx,t);return [X.a*q[0]+X.b*q[1]+J.a*v[0]+J.b*v[1],X.d*q[0]+X.e*q[1]+J.d*v[0]+J.e*v[1]]};
  B.missPath=(m,t)=>{const S=sched(),K1=Ks(S.s*S.k),q0=[m.p[0]-C[0],m.p[1]-C[1]];

/* ---- 9. The Mirror Sovereign: symmetric across its axis; its drone is your reflection in that axis ----
   It starts with its axis at right angles to your heading. Whenever you turn by some angle during a jump, it turns
   about its centre by the same angle the other way, over the same jump. Each core you destroy also sets it
   spinning by a random angle, spread smoothly over your next jump. Three cores sit in its central strip:
   one at the centre and two placed symmetrically either side of it. */
function makeMirror(){

  const alpha=tau=>{const t=Math.min(1,Math.max(0,tau-B.tick));return B.base+(B.pend-B.jth)*t};
  const toW=(x,y,tau)=>{const a=alpha(tau)*D2R,dv=[Math.cos(a),Math.sin(a)],pv=[Math.sin(a),-Math.cos(a)];return [C[0]+x*pv[0]+y*dv[0],C[1]+x*pv[1]+y*dv[1]]};
  const wingR=[[.95,-3.6],[3.6,-4.4],[4.8,0],[3.6,4.4],[.95,3.6]];   // symmetric along the axis too
  const wings=tau=>[wingR.map(([x,y])=>toW(x,y,tau)),wingR.map(([x,y])=>toW(-x,y,tau))];
  B.weak=WP.map(q=>({pos:tau=>toW(q[0],q[1],tau),r:.6,phase:0}));
  B.wallHit=(s,tau,rr=HULL5)=>wings(tau).some(P=>polyHit(s,P,rr));
  B.plan=M=>{B.jth=Math.atan2(M.d,M.a)/D2R};             // the turn in the jump being planned
  B.afterTick=()=>{B.base+=B.pend-B.jth;B.pend=0;B.jth=0};
  B.onTouch=()=>{B.pend+=(lr()<.5?-1:1)*(60+lr()*100)};   // a destroyed core sends it spinning on your next jump
  B.reflect=(p,tau)=>{const a=alpha(tau)*D2R,c=Math.cos(2*a),s2=Math.sin(2*a),d=[p[0]-C[0],p[1]-C[1]];return [C[0]+c*d[0]+s2*d[1],C[1]+s2*d[0]-c*d[1]]};

    if(Math.hypot(s[0]-m[0],s[1]-m[1])>2.5){const v=nrm([s[0]-m[0],s[1]-m[1]]);B.bullets.push({p:m,v:[v[0]*1.6,v[1]*1.6]})}

  B.draw=tau=>{let h='';const a=S(W2S(toW(0,-14,tau))),b=S(W2S(toW(0,14,tau)));
    h+=`<line class="baxis" x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}"/>`;
    for(const P of wings(tau))h+=`<polygon class="bwing" points="${pts(P.map(W2S))}"/>`;
    const me=ap(inv(G),[0,0]),m=S(W2S(B.reflect(me,tau)));
    h+=`<polygon class="bdrone" points="${OCT.map(q=>(m[0]+q[0]*U*SK).toFixed(1)+','+(m[1]-q[1]*U*SK).toFixed(1)).join(' ')}"/>`;
    return h};
  B.mat=()=>{const a=alpha(B.tick)*D2R;return {cols:2,v:[Math.cos(2*a),Math.sin(2*a),Math.sin(2*a),-Math.cos(2*a)]}};   // its reflection matrix right now
  return B;

function commitBoss(){

function bossDeath(){

  for(const w of bossActive(B)){if(gone.has(w))continue;const p=S(W2S(w.pos(tau))),r=w.r*sc;
    const oct=[...Array(8)].map((_,k)=>{const a=(22.5+45*k)*D2R;return (p[0]+Math.cos(a)*r).toFixed(1)+','+(p[1]+Math.sin(a)*r).toFixed(1)}).join(' ');
    glow+=`<circle class="wkring" style="animation-delay:${ph}s" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${(r*1.7).toFixed(1)}"/><polygon class="wkoct" points="${oct}"/><circle class="wkcore" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${(r*.4).toFixed(1)}"/>`}
  const tt=tickT;
  B.miss.forEach((m,i)=>{const q=bplan&&bplan.ms[i],end=q?q.end:Infinity;
    const at=tt==null?0:tt;if(at>=end)return;
    const pos=missAt(m,at),vel=B.missVel?B.missVel(m,pos,at):m.v,l=Math.hypot(vel[0],vel[1])||1,ux=vel[0]/l,uy=vel[1]/l;
    const a=S(W2S(pos)),tl=S(W2S([pos[0]-ux*.55,pos[1]-uy*.55]));
    glow+=missileSvg(a,tl);});
  B.bullets.forEach((b,i)=>{const n=bossNext(b),q=bplan&&bplan.bs.length===B.bullets.length?bplan.bs[i]:null,end=q?q.end:Infinity;
    if(tt!=null&&tt>=end)return;                                    // it struck armour earlier in this jump
    if(tt==null){const a=S(W2S(b.p)),te=Math.min(1,end);
      glow+=`<circle class="ebullet" cx="${a[0].toFixed(1)}" cy="${a[1].toFixed(1)}" r="${(BR*U).toFixed(1)}"/>`}
    else{const q2=S(W2S(bossPath(b,n,tt)));glow+=`<circle class="ebullet" cx="${q2[0].toFixed(1)}" cy="${q2[1].toFixed(1)}" r="${(BR*U).toFixed(1)}"/>`}});
  return {body,glow};
}

/* ---------- levels ---------- */
function startLevel(){
  epoch++;thrM=0;turnW=0;turnA=0;fxParts=[];$('fx2L').innerHTML='';lr=rng(L.seed);log=[];
  const duel=isDuel();
  {const U0=U;U=Math.max(13,Math.min(W,H)/(isBoss()?28:18));if(U!==U0)gridKey=''}
  if(L.fieldK)fieldK=L.fieldK;   // same strength on restarts and in the replay
  boss=isBoss()?makeBoss(L.type):null;bplan=null;
  phase=duel?'combat':isBoss()?'boss':'travel';enemy=null;shot=null;tickT=null;
  F=L.F0;G=inv(F);used=0;gas=L.gas!=null?L.gas:0;trail=[[0,0]];trailArc=[[0,0]];liveArc=[];live=null;state='plan';dead=false;stalled=false;fxL.innerHTML='';
  foes=duel?L.foes.map(f=>({...f,w:f.w.slice()})):[];bullets=[];pmiss=[];
  missiles=duel?foes.length+2:0;maxMissiles=duel?missiles:MISSILES;
  plan5=duel?planTick():null;
  if(boss){missiles=maxMissiles=12}
  document.body.classList.toggle('inv',duel);$('matrix').classList.add('l5');
  inputs.a.readOnly=inputs.d.readOnly=true;inputs.a.tabIndex=inputs.d.tabIndex=-1;
  for(const [k,v] of Object.entries({a:'1',b:'0',c:'0',d:'0',e:'1',f:'0'}))inputs[k].value=v;
  drawShip();readMatrix();
}
function newLevel(){stopReplay();L=genLevel(prog.type);L.seed=(Math.random()*2147483647)|0;rockPolys();startLevel()}
function retry(){startLevel()}

/* ---------- pointer ---------- */
function ptr(e){const r=svg.getBoundingClientRect();return [(e.clientX-r.left-W/2)/U,-(e.clientY-r.top-H/2)/U]}
svg.addEventListener('pointermove',e=>{const q=S(ptr(e));
  curL.innerHTML=`<line class="cur" x1="${q[0]-8}" y1="${q[1]}" x2="${q[0]+8}" y2="${q[1]}"/><line class="cur" x1="${q[0]}" y1="${q[1]-8}" x2="${q[0]}" y2="${q[1]+8}"/>`});
svg.addEventListener('pointerleave',()=>{curL.innerHTML=''});
svg.addEventListener('click',()=>{if(replaying)newLevel()});   // clicking only skips a replay; moving is done through the matrix alone

/* ---------- sizing ---------- */
function resize(){const r=svg.getBoundingClientRect();W=Math.max(200,r.width);H=Math.max(200,r.height);
  U=Math.max(13,Math.min(W,H)/(isBoss()?28:18));svg.setAttribute('viewBox',`${-W/2} ${-H/2} ${W} ${H}`);if(L){drawShip();render()}}
new ResizeObserver(resize).observe($('field'));

if(!unlocked(prog.type))prog.type=0;
/* ---------- title screen ---------- */
let titleUp=true;
(function(){
  const k=95,P=q=>(q[0]*k).toFixed(1)+','+(-q[1]*k).toFixed(1);let h='';
  for(let i=0;i<8;i++){const a=i*45,m=[RIN*Math.cos(a*D2R),RIN*Math.sin(a*D2R)],nw=(i===2?.06:.09)*k,nl=.07*k;
    h+=`<g transform="translate(${P(m)}) rotate(${-a})">${i===6?`<polygon class="jet" points="${nl},${-nw} ${nl},${nw} ${nl+.48*k},0"/>`:''}<polygon points="0,${-nw*.7} 0,${nw*.7} ${nl},${nw} ${nl},${-nw}" fill="#14062E" stroke="#3CF2FF" stroke-width="1.2"/></g>`}
  for(const x of [CANX,-CANX])h+=`<rect x="${((x-.035)*k).toFixed(1)}" y="${(-(RIN+CANL)*k).toFixed(1)}" width="${(.07*k).toFixed(1)}" height="${(CANL*k).toFixed(1)}" rx="1.5" fill="#14062E" stroke="#3CF2FF" stroke-width="1.6"/>`;
  h+=`<polygon points="${OCT.map(P).join(' ')}" fill="#14062E" stroke="#3CF2FF" stroke-width="2.4" stroke-linejoin="round"/>`;
  h+=`<g class="tcore">${OCT.map(v=>`<line x1="0" y1="0" x2="${(v[0]*k).toFixed(1)}" y2="${(-v[1]*k).toFixed(1)}" stroke="#3CF2FF" stroke-opacity=".35"/>`).join('')}
    <polygon points="${OCT.map(q=>P([q[0]*.55,q[1]*.55])).join(' ')}" fill="none" stroke="#3CF2FF" stroke-opacity=".6"/>
    <circle cx="0" cy="${(-RC*.55*k).toFixed(1)}" r="4" fill="#3CF2FF"/><circle r="6.5" fill="#3CF2FF"/></g>`;
  $('tship').innerHTML=`<g filter="url(#tglow)">${h}</g><defs><filter id="tglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
  const start=()=>{if(!titleUp)return;titleUp=false;$('title').classList.add('gone');setTimeout(()=>inputs.b.focus(),350)};
  $('tstart').addEventListener('click',start);
  document.addEventListener('keydown',e=>{if(titleUp&&(e.key==='Enter'||e.key===' ')){e.preventDefault();start()}});
  setTimeout(()=>{if(titleUp)$('tstart').focus()},50);
})();
newLevel();resize();
})();
</script>
