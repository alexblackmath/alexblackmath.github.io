<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asteroid Fields</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --page:#e6e9f5;--ink:#141935;--hue:#08698f;--muted:#59618a;--line:#cfd5ec;--chip:#ffffff;--chip-on:#e3f4fb;--field:#ffffff;--accent:#08698f;--err:#c2185b;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--page:#04050d;--ink:#e3eaff;--hue:#46f0ff;--muted:#8790bd;--line:#1d2452;--chip:#0b0f2a;--chip-on:#132048;--field:#0b0f2a;--accent:#46f0ff;--err:#ff6b9d;color-scheme:dark}
}
:root[data-theme="dark"]{--page:#04050d;--ink:#e3eaff;--hue:#46f0ff;--muted:#8790bd;--line:#1d2452;--chip:#0b0f2a;--chip-on:#132048;--field:#0b0f2a;--accent:#46f0ff;--err:#ff6b9d;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--page);color:var(--ink)}
math{font-family:"STIX Two Math","Cambria Math","Latin Modern Math",math,serif}

.app{display:grid;grid-template-columns:minmax(0,1fr) clamp(240px,27vw,440px);gap:20px;padding:16px;height:100%;align-items:center}
.stage-col{min-width:0;height:100%;display:flex;justify-content:center;align-items:center}
.stage{position:relative;contain:strict;container-type:inline-size;
  width:min(100%, calc((100dvh - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * 1.5));
  aspect-ratio:3/2;background:#050614;border-radius:6px 22px 6px 22px;overflow:hidden;outline:1px solid #1c2563}
.stage>img,.stage>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage>img{will-change:transform;pointer-events:none;object-fit:cover}
.stage>svg{touch-action:none;user-select:none;-webkit-user-select:none}

.eqpanel{min-width:0;max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:18px;padding:2px 2px 2px 0;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.eqblock{padding:6px 0 6px 18px;border-left:3px solid var(--hue)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* screens inside the stage (always dark, like the playfield) */
.screen{position:absolute;inset:0;z-index:4;overflow-y:auto;color:#dce6ff;background:rgba(4,5,16,.76);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:clamp(14px,3.2cqw,40px)}
.screen[hidden]{display:none !important}
.screen :focus-visible{outline:2px solid #46f0ff;outline-offset:2px}
#scrTitle{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:clamp(8px,1.6cqw,18px);
  background:radial-gradient(ellipse at center,rgba(4,5,16,.45),rgba(4,5,16,.9))}
.brand{margin:0;font:700 clamp(36px,10.5cqw,128px)/.95 "Chakra Petch",system-ui,sans-serif;letter-spacing:-.01em;
  background:linear-gradient(90deg,#46f0ff,#9b7bff 55%,#ff4fd8);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(70,240,255,.35))}
.tag{margin:0;color:#9aa6dc;font-size:clamp(13px,2cqw,22px)}
.menu{display:flex;gap:clamp(8px,1.4cqw,16px);flex-wrap:wrap;justify-content:center;margin-top:clamp(6px,1.6cqw,22px)}
.btn{cursor:pointer;min-width:9em;padding:.6em 1.4em;border:1px solid #2e3a8c;background:rgba(10,14,44,.75);color:#e6edff;
  border-radius:3px 12px 3px 12px;font:600 clamp(14px,2cqw,21px) "Chakra Petch",system-ui,sans-serif}
.btn.primary{border-color:#46f0ff;box-shadow:0 0 24px -8px #46f0ff}
.btn:hover,.card:hover,.back:hover{border-color:#46f0ff}
.hint{margin:clamp(4px,1.2cqw,14px) 0 0;color:#6f7ab3;font-size:clamp(11px,1.4cqw,14px)}
.hint kbd{font:inherit;border:1px solid #2e3a8c;border-radius:4px;padding:0 .35em;color:#c8d2f5}
.scr-head{display:flex;align-items:center;gap:14px;margin-bottom:clamp(10px,2cqw,24px)}
.scr-head h2{margin:0;font:600 clamp(18px,3cqw,34px) "Chakra Petch",system-ui,sans-serif;color:#fff}
.back{cursor:pointer;border:1px solid #2e3a8c;background:rgba(10,14,44,.75);color:#c8d2f5;border-radius:999px;padding:.35em .9em;
  font:clamp(12px,1.5cqw,15px) system-ui,sans-serif;white-space:nowrap}
.sub{margin:clamp(14px,2.2cqw,26px) 0 clamp(6px,1cqw,12px);font:600 clamp(13px,1.8cqw,18px) "Chakra Petch",system-ui,sans-serif;color:#9aa6dc}
.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(6px,1.1cqw,14px)}
.card{cursor:pointer;border:1px solid #232c6e;background:rgba(8,11,34,.9);border-radius:3px 12px 3px 12px;
  padding:clamp(4px,.8cqw,10px);display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.card svg{width:100%;height:auto;display:block}
.card .num{font:600 clamp(11px,1.4cqw,15px) "Chakra Petch",system-ui,sans-serif;color:#9aa6dc}
.cards.custom{grid-template-columns:repeat(3,1fr)}
.cards.custom .card{padding:clamp(8px,1.4cqw,16px) 6px;justify-content:center}
.card .cm{font-size:clamp(11px,1.5cqw,17px);color:#fff;max-width:100%;overflow:hidden}
.card .lbl{font:600 clamp(12px,1.5cqw,16px) "Chakra Petch",system-ui,sans-serif;color:#9aa6dc}
.edit-body{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(12px,2.4cqw,32px);align-items:start}
.editor{display:grid;gap:10px;font-size:clamp(13px,1.5cqw,15px)}
.editor .tpl{margin:0;font-size:clamp(14px,1.8cqw,19px);color:#9aa6dc}
.editor .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.editor label{display:flex;align-items:center;gap:6px;font-family:"STIX Two Math","Cambria Math",serif;font-style:italic;font-size:clamp(15px,1.8cqw,19px);color:#e6edff}
.editor label.plain{font-family:system-ui,sans-serif;font-style:normal;font-size:13px;color:#9aa6dc}
.editor label.grow{flex:1 1 100%}
.editor input{font:14px ui-monospace,Menlo,Consolas,monospace;width:5.2em;padding:6px 8px;border:1px solid #2e3a8c;border-radius:6px;
  background:#0a0e2a;color:#e6edff;min-width:0}
.editor label.grow input{flex:1;width:auto}
.editor input:focus{outline:2px solid #46f0ff;outline-offset:0;border-color:transparent}
.editor input[aria-invalid="true"]{border-color:#ff6b9d}
.editor .err{margin:0;color:#ff6b9d;font-size:13px}
.editor .err:empty{display:none}
.editor .help{margin:0;color:#7f8abf;font-size:12.5px;line-height:1.45}
.editor .btn{justify-self:start;margin-top:4px;min-width:7em;font-size:clamp(14px,1.6cqw,18px)}
.preview.stale svg,.preview.stale .pveq{opacity:.35}
.preview{display:grid;gap:8px}
.preview svg{width:100%;height:auto;display:block;background:#050614;border:1px solid #232c6e;border-radius:3px 12px 3px 12px}
.pveq{font-size:clamp(13px,1.7cqw,19px);color:#fff;overflow-x:auto}
@container (max-width:620px){
  .cards{grid-template-columns:repeat(4,1fr)}
  .cards.custom,.edit-body{grid-template-columns:1fr}
}
.home{position:absolute;top:clamp(6px,1.2cqw,14px);left:clamp(6px,1.2cqw,14px);z-index:3;width:clamp(30px,3.6cqw,42px);aspect-ratio:1;
  display:grid;place-items:center;padding:0;border-radius:50%;border:1px solid #2e3a8c;background:rgba(8,11,34,.7);color:#c8d2f5;cursor:pointer}
.home svg{width:58%;height:58%}
.home:hover{border-color:#46f0ff;color:#fff}
body:not([data-screen="game"]) .home,body:not([data-screen="game"]) #game,body:not([data-screen="game"]) .touch,
body:not([data-screen="game"]) .eqpanel{display:none}
body:not([data-screen="game"]) .app{grid-template-columns:minmax(0,1fr)}
.eq{font-size:clamp(16px,1.7vw,27px);overflow-x:auto}
.eq.long{font-size:clamp(13px,1.15vw,20px)}
.eq math{margin:.25em 0}

.touch{position:absolute;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;
  padding:10px 12px;pointer-events:none;z-index:2}
@media (pointer:coarse){.touch{display:flex}}
.touch .grp{display:flex;gap:10px}
.touch button{pointer-events:auto;width:clamp(44px,9vw,72px);aspect-ratio:1;border-radius:50%;
  border:1px solid #46f0ff77;background:rgba(10,14,44,.45);color:#c9f8ff;font-size:clamp(15px,2.6vw,24px);
  touch-action:none;user-select:none;-webkit-user-select:none}

@media (max-width:1000px){
  body:not([data-screen="game"]) .stage{aspect-ratio:auto;min-height:calc(100dvh - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
  .app{grid-template-columns:1fr;height:auto;align-items:start}
  .eqpanel{max-height:none;overflow:visible}
  .stage-col{height:auto}
  .stage{width:100%}
  .eq{font-size:clamp(17px,4.4vw,24px)}
  .eq.long{font-size:clamp(12px,3.3vw,18px)}
}
</style>
</head>
<body data-screen="title">
<div class="app">
  <main class="stage-col">
    <div class="stage">
      <img id="bg" alt="" decoding="sync">
      <svg id="game" viewBox="0 0 1200 800" aria-label="Game playfield">
        <path id="pEdge" stroke="none"/>
        <path id="pTrails" fill="none" stroke="#ffc24a" stroke-opacity=".5" stroke-width="1.6" stroke-linejoin="round"/>
        <path id="pBullets" fill="#fff6c8"/>
        <path id="pRocks" fill="none" stroke-width="2" stroke-linejoin="round"/>
        <path id="pShipF" fill="none" stroke="#ffc24a" stroke-width="1.6" stroke-linecap="round"/>
        <path id="pFlame" fill="none" stroke="#ff7a59" stroke-width="1.6" stroke-linejoin="round"/>
        <path id="pShip" fill="#050614" stroke="#e8fdff" stroke-width="2" stroke-linejoin="round"/>
        <path id="pLives" fill="none" stroke="#e8fdff" stroke-width="1.4" stroke-linejoin="round"/>
        <g id="gPause" style="display:none">
          <rect width="1200" height="800" fill="#03040e" fill-opacity=".55"/>
          <rect x="566" y="360" width="22" height="80" rx="3" fill="#e8fdff"/>
          <rect x="612" y="360" width="22" height="80" rx="3" fill="#e8fdff"/>
        </g>
      </svg>
      <button class="home" id="homeBtn" type="button" aria-label="Back to title" title="Back to title">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7M6.5 9v11h11V9" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <section class="screen" id="scrTitle" aria-label="Title">
        <h1 class="brand">Asteroid Fields</h1>
        <div class="menu">
          <button class="btn primary" type="button" data-go="play">Play</button>
          <button class="btn" type="button" data-go="select">Choose a field</button>
        </div>
        <p class="hint"><kbd>←</kbd> <kbd>→</kbd> steer, <kbd>↑</kbd> thrust, <kbd>Space</kbd> fire, <kbd>Shift</kbd> jump, <kbd>P</kbd> pause</p>
      </section>

      <section class="screen" id="scrSelect" aria-label="Choose a field" hidden>
        <div class="scr-head"><button class="back" type="button" data-go="title">← Title</button><h2>Choose a field</h2></div>
        <div class="cards" id="chips"></div>
        <h3 class="sub">Build your own</h3>
        <div class="cards custom" id="customBtns"></div>
      </section>

      <section class="screen" id="scrEdit" aria-label="Build a field" hidden>
        <div class="scr-head"><button class="back" type="button" data-go="select">← Fields</button><h2 id="edTitle"></h2></div>
        <div class="edit-body">
          <form class="editor" id="editor" autocomplete="off" novalidate></form>
          <div class="preview" aria-live="polite">
            <svg id="pvSvg" viewBox="0 0 120 80" aria-label="Preview of the field"></svg>
            <div class="pveq" id="pvEq"></div>
          </div>
        </div>
      </section>

      <div class="touch" aria-hidden="true">
        <div class="grp"><button data-k="arrowleft">◀</button><button data-k="arrowright">▶</button></div>
        <div class="grp"><button data-k="shift">✦</button><button data-k="arrowup">▲</button><button data-k=" ">●</button></div>
      </div>
    </div>
  </main>
  <aside class="eqpanel">
    <div class="eqblock" aria-live="polite"><div class="eq" id="fEq"></div></div>
  </aside>
</div>

<script>
(() => {
'use strict';
const W = 1200, H = 800, CAP = 280, MARGIN = 360, TAU = Math.PI * 2, PI = Math.PI;
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const sqrt = Math.sqrt, cos = Math.cos, sin = Math.sin;
const n0 = v => Math.round(v);          // integer coords keep path strings short
const f1 = v => Math.round(v * 10) / 10;

/* ---------------- MathML helpers ---------------- */
const mi = s => `<mi>${s}</mi>`, mn = s => `<mn>${s}</mn>`, mo = s => `<mo>${s}</mo>`;
const r = (...a) => `<mrow>${a.join('')}</mrow>`;
const fr = (a, b) => `<mfrac>${a}${b}</mfrac>`;
const sq = a => `<msup>${a}${mn(2)}</msup>`;
const X = mi('x'), Y = mi('y'), MINUS = mo('−'), PLUS = mo('+'), EQ = mo('='), COMMA = mo(',');
const IT = '<mo>&#x2062;</mo>', AF = '<mo>&#x2061;</mo>';
const SP = '<mspace width="0.17em"/>';
const BF = '<mi>𝐅</mi>';
const LA = '<mo stretchy="false">⟨</mo>', RA = '<mo stretchy="false">⟩</mo>';
const vec = (p, q) => r(LA, p, COMMA, q, RA);
const par = a => r(mo('('), a, mo(')'));
const FXY = r(BF, par(r(X, COMMA, Y)));
const M = (...a) => `<math display="block">${r(...a)}</math>`;
const fn = (n, a) => r(SP, mi(n), AF, SP, a);
const sinx = fn('sin', X), siny = fn('sin', Y), cosx = fn('cos', X), cosy = fn('cos', Y);
const R2 = r(sq(X), PLUS, sq(Y));
const Q1 = r(sq(par(r(X, PLUS, mn(2)))), PLUS, sq(Y)), Q2 = r(sq(par(r(X, MINUS, mn(2)))), PLUS, sq(Y));

/* ---------------- fields ---------------- */
const nearOrigin = (a, b) => () => { const t = rnd(0, TAU), q = rnd(a, b); return [q * Math.cos(t), q * Math.sin(t)]; };
const nearPts = (pts, rad) => () => { const p = pts[Math.floor(Math.random() * pts.length)], t = rnd(0, TAU), q = rnd(0.05, rad); return [p[0] + q * Math.cos(t), p[1] + q * Math.sin(t)]; };
const gMax = [[PI/2, PI/2], [-PI/2, -PI/2], [-3*PI/2, PI/2], [3*PI/2, -PI/2]];
const gMin = [[PI/2, -PI/2], [-PI/2, PI/2], [3*PI/2, PI/2], [-3*PI/2, -PI/2]];
const grid = (xs, ys, t) => xs.flatMap(x => ys.map(y => ({x, y, t})));

const LEVELS = [
{ R: 6, k: 0.36, mode: 'wrap', hue: '#46f0ff', count: 3,
  F: (x, y) => [2, 1],
  eq: M(FXY, EQ, vec(mn(2), mn(1))),
  },
{ R: 6, k: 0.25, mode: 'flow', hue: '#ffc24a', count: 4,
  F: (x, y) => [x, y],
  eq: M(FXY, EQ, vec(X, Y)),
  marks: [{x: 0, y: 0, t: 'source'}], inject: nearOrigin(0.2, 0.7) },
{ R: 6, k: 0.25, mode: 'flow', hue: '#ff4fd8', count: 4,
  F: (x, y) => [-x, -y],
  eq: M(FXY, EQ, vec(r(MINUS, X), r(MINUS, Y))),
  marks: [{x: 0, y: 0, t: 'sink'}] },
{ R: 6, k: 0.2, mode: 'flow', hue: '#9b7bff', count: 4, spawn: [0, 0],
  F: (x, y) => [-y, x],
  eq: M(FXY, EQ, vec(r(MINUS, Y), X)),
  marks: [{x: 0, y: 0, t: 'center'}] },
{ R: 6, k: 0.3, mode: 'wrap', hue: '#7dffb0', count: 4,
  F: (x, y) => [y, 0],
  eq: M(FXY, EQ, vec(Y, mn(0))),
  eqline: true },
{ R: 6, k: 0.28, mode: 'flow', hue: '#ff7a59', count: 5,
  F: (x, y) => [x, -y],
  eq: M(FXY, EQ, vec(X, r(MINUS, Y))),
  marks: [{x: 0, y: 0, t: 'saddle'}] },
{ R: 6, k: 0.22, mode: 'flow', hue: '#46f0ff', count: 5,
  F: (x, y) => [-0.3 * x - y, x - 0.3 * y],
  eq: M(FXY, EQ, vec(r(MINUS, mn('0.3'), IT, X, MINUS, Y), r(X, MINUS, mn('0.3'), IT, Y))),
  marks: [{x: 0, y: 0, t: 'spiral'}] },
{ R: 5.2, k: 0.7, mode: 'flow', hue: '#ffc24a', count: 5, piTicks: true,
  F: (x, y) => [Math.cos(x) * Math.sin(y), Math.sin(x) * Math.cos(y)],
  eq: M(FXY, EQ, vec(r(cosx, IT, siny), r(sinx, IT, cosy))),
  marks: [...gMax.map(([x, y]) => ({x, y, t: 'sink'})), ...gMin.map(([x, y]) => ({x, y, t: 'source'})),
          ...grid([-PI, 0, PI], [-PI, 0, PI], 'saddle')],
  inject: nearPts(gMin, 0.35) },
{ R: 2 * PI, k: 1.0, mode: 'flow', hue: '#9b7bff', count: 5, piTicks: true, spawn: [0, 0.01],
  F: (x, y) => [Math.sin(x) * Math.cos(y), -Math.cos(x) * Math.sin(y)],
  eq: M(FXY, EQ, vec(r(sinx, IT, cosy), r(MINUS, cosx, IT, siny))),
  marks: [...grid([-3*PI/2, -PI/2, PI/2, 3*PI/2], [-PI/2, PI/2], 'center'), ...grid([-PI, 0, PI], [-PI, 0, PI], 'saddle')] },
{ R: 5, k: 1.3, mode: 'flow', hue: '#ff4fd8', count: 5,
  F: (x, y) => { const q = x*x + y*y; return [-y / q, x / q]; },
  eq: M(FXY, EQ, fr(vec(r(MINUS, Y), X), R2)),
  marks: [{x: 0, y: 0, t: 'singular'}] },
{ R: 5, k: 1.2, mode: 'flow', hue: '#7dffb0', count: 5, spawn: [0, -2.4], long: true,
  F: (x, y) => { const a = x + 2, b = x - 2, q1 = a*a + y*y, q2 = b*b + y*y; return [a / q1 - b / q2, y / q1 - y / q2]; },
  eq: M(FXY, EQ, vec(mi('P'), mi('Q'))) +
      M(mi('P'), EQ, fr(r(X, PLUS, mn(2)), Q1), MINUS, fr(r(X, MINUS, mn(2)), Q2)) +
      M(mi('Q'), EQ, fr(Y, Q1), MINUS, fr(Y, Q2)),
  marks: [{x: -2, y: 0, t: 'source'}, {x: 2, y: 0, t: 'sink'}], inject: nearPts([[-2, 0]], 0.35) },
{ R: 2.4, k: 0.4, mode: 'flow', hue: '#ffc24a', count: 6, spawn: [0, 0], cycleR: 1,
  F: (x, y) => { const q = x*x + y*y; return [x - y - x * q, x + y - y * q]; },
  eq: M(FXY, EQ, vec(mi('P'), mi('Q'))) +
      M(mi('P'), EQ, X, MINUS, Y, MINUS, X, IT, par(R2)) +
      M(mi('Q'), EQ, X, PLUS, Y, MINUS, Y, IT, par(R2)),
  marks: [{x: 0, y: 0, t: 'spiral'}], inject: nearOrigin(0.1, 0.3) }
];


/* ---------------- state ---------------- */
const LV = LEVELS.length;
const G = { idx: 0, cycle: 0, fs: 1, state: 'ready', lives: 3, sound: true, lastLives: -1, lastPause: null, custom: null, editing: null,
  cp: {
    const: { a: '1', b: '0.5' },
    linear: { a: '1', b: '2', e: '1', c: '2', d: '-2', f: '-1', R: '6' },
    expr: { P: 'y', Q: '-sin(x) - 0.2y', R: '7' }
  } };
let L, R, S, HM, K;                     // K = c·S·fieldScale, folded once per level
let ship, rocks = [], bullets = [];
const keys = {};
const el = {};
for (const id of ['bg', 'game', 'fEq', 'editor', 'chips', 'customBtns', 'scrTitle', 'scrSelect', 'scrEdit', 'edTitle', 'pvSvg', 'pvEq', 'homeBtn', 'pEdge', 'pTrails', 'pBullets', 'pRocks', 'pShipF', 'pFlame', 'pShip', 'pLives', 'gPause']) el[id] = $(id);

const toPx = (x, y) => [W / 2 + x * S, H / 2 - y * S];

// field velocity in px/s at a screen point, capped; written into out[] to avoid allocation
const FV = [0, 0];
function fieldPx(px, py) {
  const F = L.F((px - W / 2) / S, (H / 2 - py) / S);

  const dt = Math.min(0.033, (t - last) / 1000); last = t;
  if (G.screen === 'game') {                       // menus cost nothing per frame
    if (G.state !== 'paused') update(dt);
    render(t / 1000);
  }
  requestAnimationFrame(frame);
}
buildMenus();

L = LEVELS[8]; R = L.R; S = (W / 2) / R; HM = (H / 2) / S;
menuBg = buildBackground();
G.screen = 'title'; el.bg.src = menuBg;
requestAnimationFrame(frame);
})();
