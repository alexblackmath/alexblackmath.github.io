<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Inverse Lab</title>
  <meta name="description" content="Find a matrix inverse by playing with row operations. Transform the left matrix into the identity and watch its inverse appear on the right.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23142436'/%3E%3Cpath d='M10 7H6v18h4m12-18h4v18h-4M16 9v14' fill='none' stroke='%23b5f16c' stroke-width='2.4'/%3E%3C/svg%3E">
  <style>
    :root{color-scheme:light;--ink:#17212b;--muted:#67727d;--line:#e3e7eb;--teal:#147d70;--font:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;background:#fff;color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5}
    button,input,select{font:inherit}
    button{cursor:pointer;transition:background .15s,color .15s}
    button:disabled{cursor:default;opacity:.35}
    button,input,select,summary{touch-action:manipulation}
    button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--teal);outline-offset:4px}
    [hidden]{display:none!important}
    .shell{max-width:850px;padding:0 32px;margin:0 auto}
    .topbar{min-height:106px;display:flex;align-items:center;justify-content:space-between;gap:22px;border-bottom:1px solid var(--line)}
    h1{font-size:20px;font-weight:650;letter-spacing:-.6px;margin:0}
    .challenge-controls{display:flex;gap:18px;align-items:center}
    .size-control{display:flex;gap:2px}
    .size-control button{border:0;background:transparent;color:var(--muted);padding:9px 10px;border-radius:5px;font-size:14px}
    .size-control button[aria-pressed="true"]{background:#f0f2f4;color:var(--ink);font-weight:650}
    .button{border:1px solid #d2d8de;border-radius:5px;padding:9px 15px;background:#fff;color:var(--ink);font-size:14px;font-weight:550;min-height:41px}
    .button:hover:not(:disabled){background:#f4f6f7}
    main{padding:34px 0 48px}
    .matrix-head{max-width:720px;margin:0 auto 20px;padding-left:30px;display:grid;grid-template-columns:1fr 1fr;text-align:center;font-family:Cambria,Georgia,serif;font-size:22px}
    .matrix-title.right{color:var(--teal)}
    .matrix-area{display:grid;grid-template-columns:30px minmax(0,1fr);align-items:stretch;max-width:720px;margin:0 auto 30px;overflow-x:auto}
    .row-labels{display:grid;grid-auto-rows:72px;align-items:center;padding:18px 0;gap:8px;font-family:Cambria,Georgia,serif;color:#74808c;font-size:15px}
    .row-labels span{display:flex;align-items:center}
    .row-labels .row-selected{color:var(--ink)}
    .augmented{display:grid;grid-template-columns:minmax(0,1fr) 1px minmax(0,1fr);gap:24px;padding:18px;position:relative;min-width:var(--matrix-min,0px)}
    .augmented:before,.augmented:after{content:"";position:absolute;top:0;bottom:0;width:10px;border-top:1.5px solid #77838f;border-bottom:1.5px solid #77838f}
    .augmented:before{left:0;border-left:1.5px solid #77838f}
    .augmented:after{right:0;border-right:1.5px solid #77838f}
    .divider{background:#c1cad1;width:1px}
    .matrix-half{display:grid;grid-auto-rows:72px;gap:8px;min-width:0}
    .matrix-row{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:5px;border-radius:3px;transition:background .2s}
    .matrix-row.target{background:#f3f5f7}
    .right-half .matrix-row.target{background:#f0f7f5}
    .matrix-row.source{box-shadow:inset 0 -1px 0 #dce5e1}
    .entry{font-family:"Cambria Math",Cambria,Georgia,serif;font-size:35px;font-variant-numeric:lining-nums tabular-nums;display:flex;align-items:center;justify-content:center;min-width:0;line-height:1.05;padding:7px 2px;white-space:nowrap}
    .right-half .entry{color:var(--teal)}
    .entry.zero{opacity:.48}
    .entry.compact{font-size:20px}
    .entry.tiny{font-size:14px}
    .frac{display:inline-flex;vertical-align:middle;flex-direction:column;align-items:stretch;font-size:.74em;text-align:center;gap:3px}
    .frac .numerator{border-bottom:1px solid currentColor;padding:0 4px 3px}
    .frac .denominator{padding:0 4px}
    .matrix-row.flash{animation:rowFlash .6s ease-out}
    @keyframes rowFlash{0%,25%{background:#cce8df}100%{background:transparent}}
    .board-foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:13px 0;gap:14px}
    .solved{color:var(--teal);font-size:14px;font-weight:600}
    .board-actions{display:flex;gap:20px;margin-left:auto}
    .text-button{border:0;background:transparent;color:var(--muted);font-size:14px;padding:4px 0;min-height:32px}
    .text-button:hover:not(:disabled){color:var(--ink);text-decoration:underline;text-underline-offset:4px}
    .panel{padding-top:13px}
    .op-tabs{display:flex;gap:25px;border-bottom:1px solid var(--line);margin-bottom:22px}
    .op-tabs button{border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);padding:11px 0;font-size:14px;font-weight:550;min-width:0}
    .op-tabs button[aria-pressed="true"]{border-bottom-color:var(--ink);color:var(--ink)}
    .fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;align-items:end}
    .field{display:flex;flex-direction:column;gap:6px;min-width:0}
    .field label{font-size:14px;color:var(--muted)}
    .field input,.field select{width:100%;height:43px;min-width:0;border:1px solid #d2d8de;border-radius:5px;background:#fff;color:var(--ink);padding:8px 10px}
    .field input[aria-invalid="true"]{border-color:#b0343c}
    .action-line{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:22px}
    .operation-preview{font-family:Cambria,Georgia,serif;font-size:22px;line-height:1.35;overflow-wrap:anywhere;min-width:0}
    .primary{background:var(--ink);color:#fff;border-color:var(--ink);min-width:95px}
    .primary:hover:not(:disabled){background:#35414c}
    .error{color:#a42634;font-size:14px;margin:12px 0 0}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:600px){.shell{padding:0 20px}.topbar{min-height:90px;gap:15px;flex-wrap:wrap;padding:20px 0}h1{font-size:19px}.challenge-controls{gap:8px}.size-control button{padding:8px}.button{padding:9px 12px}main{padding-top:28px}.matrix-head{font-size:20px;padding-left:22px;margin-bottom:15px}.matrix-area{grid-template-columns:22px minmax(0,1fr);margin-bottom:24px}.row-labels{font-size:13px;padding:14px 0}.augmented{gap:10px;padding:14px 8px}.augmented:before,.augmented:after{width:7px}.matrix-half,.row-labels{grid-auto-rows:64px}.matrix-row{gap:2px}.entry{font-size:27px}.entry.compact{font-size:17px}.entry.tiny{font-size:12px}.fields{gap:10px}.op-tabs{gap:24px}.board-actions{gap:16px}}
    @media(max-width:400px){.topbar{align-items:flex-start;flex-direction:column;gap:15px}.challenge-controls{width:100%;justify-content:space-between}.shell{padding:0 16px}.fields{gap:8px}.field label{font-size:14px}.field input,.field select{padding:8px 6px}.op-tabs{gap:20px}.operation-preview{font-size:20px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <h1>Inverse lab</h1>
      <div class="challenge-controls">
        <div class="size-control" role="group" aria-label="Matrix size">
          <button id="size-2" aria-pressed="true" data-size="2">2 × 2</button>
          <button id="size-3" aria-pressed="false" data-size="3">3 × 3</button>
        </div>
        <button class="button" id="new-matrix">New matrix</button>
      </div>
    </header>
    <main>
      <section class="board" aria-label="Augmented matrix: reduce the left side to identity">
        <div class="matrix-head" aria-hidden="true">
          <span class="matrix-title" id="left-title">A → I</span>
          <span class="matrix-title right" id="right-title">I → A⁻¹</span>
        </div>
        <div class="matrix-area" id="matrix-area"></div>
        <div class="board-foot">
          <span class="solved" id="success" role="status" hidden>Solved</span>
          <div class="board-actions">
            <button class="text-button" id="undo" disabled>Undo</button>
            <button class="text-button" id="restart" disabled>Restart</button>
          </div>
        </div>
      </section>
      <section class="panel" aria-label="Row operation controls">
        <div class="op-tabs" role="group" aria-label="Row operation">
          <button data-op="add" aria-pressed="true">Replacement</button>
          <button data-op="scale" aria-pressed="false">Scale</button>
          <button data-op="swap" aria-pressed="false">Swap</button>
        </div>
        <form id="operation-form" novalidate>
          <div class="fields" id="fields">
            <div class="field"><label for="target" id="target-label">Target</label><select id="target"></select></div>
            <div class="field" id="factor-field"><label for="factor">Factor</label><input id="factor" type="text" value="-1" maxlength="40" autocomplete="off" spellcheck="false" aria-describedby="error" placeholder="−2 or 1/2"></div>
            <div class="field" id="source-field"><label for="source" id="source-label">Source</label><select id="source"></select></div>
          </div>
          <div class="action-line">
            <div class="operation-preview" id="operation-preview" aria-label="Operation to apply"></div>
            <button type="submit" class="button primary" id="apply">Apply</button>
          </div>
          <p id="error" class="error" role="alert" hidden></p>
        </form>
      </section>
    </main>
    <div class="sr-only" aria-live="polite" aria-atomic="true" id="announcement"></div>
  </div>

  <script id="matrix-core">
  "use strict";
  (() => {
    const gcd = (a, b) => { a = a < 0n ? -a : a; b = b < 0n ? -b : b; while (b) { const r = a % b; a = b; b = r; } return a; };
    class Q {
      constructor(n, d = 1n) {
        n = BigInt(n); d = BigInt(d);
        if (d === 0n) throw new Error("A denominator cannot be zero.");
        if (d < 0n) { n = -n; d = -d; }
        const g = gcd(n, d);
        this.n = n / g; this.d = d / g;
        Object.freeze(this);
      }
      add(q) { return new Q(this.n * q.d + q.n * this.d, this.d * q.d); }
      mul(q) { return new Q(this.n * q.n, this.d * q.d); }
      div(q) { return new Q(this.n * q.d, this.d * q.n); }
      neg() { return new Q(-this.n, this.d); }
      eq(q) { return this.n === q.n && this.d === q.d; }
      get zero() { return this.n === 0n; }
      get one() { return this.n === 1n && this.d === 1n; }
      toString() { return this.d === 1n ? String(this.n) : this.n + "/" + this.d; }
    }
    const ZERO = new Q(0), ONE = new Q(1);
    const decimal = s => {
      const negative = s.startsWith("-");
      s = s.replace(/^[+-]/, "");
      const parts = s.split(".");
      const digits = (parts[0] || "0") + (parts[1] || "");
      return new Q((negative ? -1n : 1n) * BigInt(digits), 10n ** BigInt((parts[1] || "").length));
    };
    const parse = value => {
      const s = String(value).trim().replace(/−/g, "-");
      if (!s) throw new Error("Enter a factor.");
      if (s.length > 40) throw new Error("Maximum 40 characters.");
      if (!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:\/[+-]?(?:\d+(?:\.\d*)?|\.\d+))?$/.test(s)) throw new Error("Enter a number or fraction.");
      const parts = s.split("/");
      const n = decimal(parts[0]);
      if (parts.length === 1) return n;
      const d = decimal(parts[1]);
      if (d.zero) throw new Error("A denominator cannot be zero.");
      return n.div(d);
    };
    const identity = n => Array.from({length:n}, (_,i) => Array.from({length:n}, (_,j) => i === j ? ONE : ZERO));
    const from = m => m.map(row => row.map(v => v instanceof Q ? v : parse(v)));
    const clone = m => m.map(row => row.slice());
    const augment = m => m.map((row,i) => row.concat(identity(m.length)[i]));
    const left = m => m.map(row => row.slice(0, m.length));
    const right = m => m.map(row => row.slice(m.length));
    const isIdentity = m => m.every((row,i) => row.slice(0,m.length).every((q,j) => q.eq(i === j ? ONE : ZERO)));
    const completed = m => Array.from({length:m.length}, (_,j) => m.every((row,i) => row[j].eq(i === j ? ONE : ZERO)));
    const validate = (m, op) => {
      if (!op || !["add","scale","swap"].includes(op.type)) throw new Error("Choose Replacement, Scale, or Swap.");
      const validRow = r => Number.isInteger(r) && r >= 0 && r < m.length;
      if (!validRow(op.target)) throw new Error("Choose a valid row to change.");
      if (op.type !== "scale") {
        if (!validRow(op.source)) throw new Error("Choose a valid source row.");
        if (op.source === op.target) throw new Error("Choose two different rows.");
      }
      if (op.type !== "swap") {
        if (!(op.factor instanceof Q)) throw new Error("Enter a valid multiplier.");
        if (op.factor.zero) throw new Error(op.type === "scale" ? "The scale factor must be nonzero." : "The replacement factor must be nonzero.");
        if (op.type === "scale" && op.factor.one) throw new Error("A scale factor of 1 makes no change.");
      }
    };
    const operate = (m, op) => {
      validate(m, op);
      const result = clone(m);
      if (op.type === "swap") [result[op.target], result[op.source]] = [result[op.source], result[op.target]];
      if (op.type === "scale") result[op.target] = m[op.target].map(q => q.mul(op.factor));
      if (op.type === "add") result[op.target] = m[op.target].map((q,j) => q.add(m[op.source][j].mul(op.factor)));
      return result;
    };
    const multiply = (a,b) => a.map(row => b[0].map((_,j) => row.reduce((sum,q,k) => sum.add(q.mul(b[k][j])), ZERO)));
    const same = (a,b) => a.length === b.length && a.every((row,i) => row.length === b[i].length && row.every((q,j) => q.eq(b[i][j])));
    const serialize = m => m.map(row => row.map(q => q.toString()));
    const randomInt = (min,max) => min + Math.floor(Math.random() * (max-min+1));
    const generate = (n, previous) => {
      for (let attempt = 0; attempt < 80; attempt++) {
        let m = identity(n);
        for (let step = 0; step < (n === 2 ? 4 : 6); step++) {
          const target = randomInt(0,n-1), source = (target + randomInt(1,n-1)) % n;
          const choices = [-2,-1,1,2];
          m = operate(m, {type:"add",target,source,factor:new Q(choices[randomInt(0,3)])});
        }
        if (Math.random() < .4) m = operate(m,{type:"scale",target:randomInt(0,n-1),factor:new Q(randomInt(2,3))});
        if (Math.random() < .3) m = operate(m,{type:"swap",target:0,source:n-1});
        if (!isIdentity(m) && (!previous || !same(m,previous)) && m.every(row => row.every(q => q.n >= -12n && q.n <= 12n))) return m;
      }
      const options = n === 2 ? [[[2,1],[1,3]],[[0,2],[3,1]]] : [[[1,1,0],[0,1,1],[1,0,1]],[[1,2,0],[0,1,1],[1,3,2]]];
      return from(options.find(v => !previous || !same(from(v),previous)) || options[0]);
    };
    globalThis.MatrixMath = Object.freeze({Q,ZERO,ONE,parse,identity,from,clone,augment,left,right,isIdentity,completed,operate,multiply,same,serialize,generate});
  })();
  </script>

  <script id="game-ui">
  "use strict";
  (() => {
    const M = globalThis.MatrixMath;
    const $ = id => document.getElementById(id);
    const sub = n => ["₁","₂","₃"][n];
    const rowName = n => "R" + sub(n);
    let n = 2, original = M.from([[1,2],[3,7]]), matrix = M.augment(original);
    let undoHead = null, operationType = "add", won = false, lastRows = [];
    const pretty = q => q.toString().replace(/-/g,"−");
    const opText = op => {
      if (op.type === "swap") return rowName(op.target) + " ↔ " + rowName(op.source);
      if (op.type === "scale") return rowName(op.target) + " ← (" + pretty(op.factor) + ") " + rowName(op.target);
      const positive = op.factor.n > 0n, absolute = positive ? op.factor : op.factor.neg();
      return rowName(op.target) + " ← " + rowName(op.target) + (positive ? " + " : " − ") + (absolute.one ? "" : (absolute.d === 1n ? pretty(absolute) : "(" + pretty(absolute) + ")")) + rowName(op.source);
    };
    const opSpoken = op => {
      if (op.type === "swap") return "Swap row " + (op.target+1) + " and row " + (op.source+1);
      if (op.type === "scale") return "Multiply row " + (op.target+1) + " by " + op.factor;
      return "Add " + op.factor + " times row " + (op.source+1) + " to row " + (op.target+1);
    };
    const announce = text => { $("announcement").textContent = text; };
    const hideError = () => { $("error").hidden = true; $("error").textContent = ""; $("factor").removeAttribute("aria-invalid"); };
    const showError = message => { $("error").textContent = message; $("error").hidden = false; if (operationType !== "swap") $("factor").setAttribute("aria-invalid","true"); };
    const cellHTML = q => {
      const len = Math.max(String(q.n).length, String(q.d).length);
      const classes = "entry" + (q.zero ? " zero" : "") + (len > 7 ? " tiny" : len > 4 ? " compact" : "");
      const value = q.d === 1n ? pretty(q) : '<span class="frac" aria-hidden="true"><span class="numerator">' + String(q.n).replace("-","−") + '</span><span class="denominator">' + q.d + '</span></span>';
      return '<span class="' + classes + '" role="cell" aria-label="' + q.toString() + '">' + value + '</span>';
    };
    const readOperation = () => {
      const op = {type:operationType,target:Number($("target").value)};
      if (operationType !== "scale") op.source = Number($("source").value);
      if (operationType !== "swap") op.factor = M.parse($("factor").value);
      M.operate(matrix, op);
      return op;
    };
    const updatePreview = () => {
      hideError();
      try { const op = readOperation(); $("operation-preview").textContent = opText(op); $("operation-preview").setAttribute("aria-label",opSpoken(op)); }
      catch { $("operation-preview").textContent = "—"; }
      renderMatrix();
    };
    const renderMatrix = () => {
      const target = Number($("target").value), source = operationType === "scale" ? -1 : Number($("source").value);
      const rowClasses = i => "matrix-row" + (!won && i === target ? " target" : "") + (!won && i === source && source !== target ? " source" : "") + (lastRows.includes(i) ? " flash" : "");
      const half = (offset,label) => '<div class="matrix-half ' + (offset ? "right-half" : "") + '" role="table" aria-label="' + label + '">' + matrix.map((row,i) => '<div class="' + rowClasses(i) + '" role="row">' + row.slice(offset,offset+n).map(cellHTML).join("") + '</div>').join("") + '</div>';
      $("matrix-area").style.setProperty("--n",n);
      const maxDigits = Math.max(...matrix.flat().map(q => Math.max(String(q.n).length,String(q.d).length)));
      $("matrix-area").style.setProperty("--matrix-min",maxDigits > 4 ? (2*n*(maxDigits*9+10)+70) + "px" : "0px");
      $("matrix-area").innerHTML = '<div class="row-labels" aria-hidden="true">' + matrix.map((_,i) => '<span class="' + (!won && i === target ? "row-selected" : "") + '">' + rowName(i) + '</span>').join("") + '</div><div class="augmented">' + half(0,won ? "Left matrix: identity" : "Left matrix to reduce") + '<div class="divider" aria-hidden="true"></div>' + half(n,won ? "Inverse of the original matrix" : "Right matrix: the same row operations applied to identity") + '</div>';
    };
    const setOperationType = type => {
      operationType = type;
      document.querySelectorAll("[data-op]").forEach(b => b.setAttribute("aria-pressed",String(b.dataset.op === type)));
      $("factor-field").hidden = type === "swap";
      $("source-field").hidden = type === "scale";
      $("fields").style.gridTemplateColumns = type === "add" ? "" : "1fr 1fr";
      $("target-label").textContent = type === "swap" ? "Row" : type === "scale" ? "Row" : "Target";
      $("source-label").textContent = type === "swap" ? "With" : "Source";
      updatePreview();
    };
    const fillRows = () => {
      const options = Array.from({length:n},(_,i) => '<option value="' + i + '">Row ' + (i+1) + '</option>').join("");
      $("target").innerHTML = options; $("source").innerHTML = options;
      $("target").value = "1"; $("source").value = "0";
    };
    const render = () => {
      won = M.isIdentity(matrix);
      renderMatrix();
      $("undo").disabled = undoHead === null;
      $("restart").disabled = undoHead === null;
      $("left-title").textContent = won ? "I" : "A → I";
      $("right-title").textContent = won ? "A⁻¹" : "I → A⁻¹";
      $("success").hidden = !won;
      $("apply").disabled = won;
      $("target").disabled = won; $("source").disabled = won; $("factor").disabled = won;
      document.querySelectorAll("[data-op]").forEach(b => b.disabled = won);
      document.querySelectorAll("[data-size]").forEach(b => b.setAttribute("aria-pressed",String(Number(b.dataset.size) === n)));
    };
    const readState = () => ({
      size:n,original:M.serialize(original),left:M.serialize(M.left(matrix)),right:M.serialize(M.right(matrix)),
      solved:won,canUndo:undoHead !== null
    });
    const perform = op => {
      if (won) throw new Error("Already solved.");
      const next = M.operate(matrix,op);
      if (next.some(row => row.some(q => String(q.n).length > 14 || String(q.d).length > 14))) throw new Error("Result too large to display.");
      undoHead = {before:M.clone(matrix),previous:undoHead};
      matrix = next; lastRows = op.type === "swap" ? [op.target,op.source] : [op.target];
      hideError(); render(); lastRows = [];
      announce(opSpoken(op) + "." + (won ? " Solved." : ""));
      return readState();
    };
    const undo = () => {
      if (!undoHead) throw new Error("Nothing to undo.");
      matrix = undoHead.before; undoHead = undoHead.previous; lastRows = []; hideError(); render(); updatePreview();
      announce("Last operation undone.");
      return readState();
    };
    const start = (size = n, restart = false) => {
      if (![2,3].includes(size)) throw new Error("Choose a 2 × 2 or 3 × 3 matrix.");
      if (!restart) {
        original = size === 3 && n !== 3 ? M.from([[1,2,0],[0,1,1],[1,3,2]]) : M.generate(size,size === n ? original : undefined);
      }
      n = size; matrix = M.augment(original); undoHead = null; lastRows = []; won = false;
      fillRows(); $("factor").value = "-1"; setOperationType("add"); hideError(); render();
      announce(restart ? "Challenge restarted." : "New " + n + " by " + n + " challenge ready.");
      return readState();
    };
    $("operation-form").addEventListener("submit",event => {
      event.preventDefault();
      try { perform(readOperation()); } catch(error) { showError(error.message); }
    });
    document.querySelectorAll("[data-op]").forEach(b => b.addEventListener("click",() => { setOperationType(b.dataset.op); }));
    ["target","source"].forEach(id => $(id).addEventListener("change",() => {
      if (operationType !== "scale" && $("target").value === $("source").value) {
        const other = id === "target" ? "source" : "target";
        $(other).value = String((Number($(id).value)+1) % n);
      }
      updatePreview();
    }));
    $("factor").addEventListener("input",updatePreview);
    $("undo").addEventListener("click",() => undo());
    $("restart").addEventListener("click",() => start(n,true));
    $("new-matrix").addEventListener("click",() => start());
    document.querySelectorAll("[data-size]").forEach(b => b.addEventListener("click",() => { if (Number(b.dataset.size) !== n) start(Number(b.dataset.size)); }));
    fillRows(); setOperationType("add"); render();
    globalThis.InverseLab = Object.freeze({readState,perform,undo,start});

    const context = document.modelContext;
    if (context && typeof context.registerTool === "function") {
      const lifecycle = new AbortController();
      const register = tool => {
        try { Promise.resolve(context.registerTool(tool,{signal:lifecycle.signal})).catch(() => {}); } catch {}
      };
      register({
        name:"read_matrix_game",title:"Read matrix game",
        description:"Read the current augmented matrix, original matrix, and completion state. Fractions are exact strings.",
        inputSchema:{type:"object",properties:{},additionalProperties:false},
        annotations:{readOnlyHint:true,untrustedContentHint:false},
        execute:() => readState()
      });
      register({
        name:"apply_matrix_row_operation",title:"Apply a row operation",
        description:"Apply one elementary row operation to both halves of the augmented matrix. Row numbers start at 1. This completes the move immediately.",
        inputSchema:{type:"object",properties:{type:{type:"string",enum:["add","scale","swap"]},target:{type:"integer",minimum:1,maximum:3},source:{type:"integer",minimum:1,maximum:3},factor:{type:"string",description:"An exact whole number, decimal, or fraction. Required for add and scale."}},required:["type","target"],additionalProperties:false},
        annotations:{readOnlyHint:false,untrustedContentHint:false},
        execute:input => {
          if (!input || typeof input !== "object" || !Number.isInteger(input.target) || !["add","scale","swap"].includes(input.type)) throw new Error("Supply a valid operation and a target row numbered from 1.");
          if (Object.keys(input).some(k => !["type","target","source","factor"].includes(k))) throw new Error("Unexpected input field.");
          const op = {type:input.type,target:input.target-1};
          if (op.type !== "scale") { if (!Number.isInteger(input.source)) throw new Error("Supply a source row numbered from 1."); op.source = input.source-1; }
          if (op.type !== "swap") { if (typeof input.factor !== "string") throw new Error("Supply the multiplier as a string."); op.factor = M.parse(input.factor); }
          const result = perform(op);
          $("target").value = String(op.target);
          if (op.source !== undefined) $("source").value = String(op.source);
          if (op.factor) $("factor").value = op.factor.toString();
          setOperationType(op.type);
          return result;
        }
      });
      register({
        name:"start_matrix_challenge",title:"Start a matrix challenge",
        description:"Start a fresh invertible matrix challenge of the selected size. This resets the matrix.",
        inputSchema:{type:"object",properties:{size:{type:"integer",enum:[2,3]}},required:["size"],additionalProperties:false},
        annotations:{readOnlyHint:false,untrustedContentHint:false},
        execute:input => { if (!input || Object.keys(input).some(k => k !== "size") || ![2,3].includes(input.size)) throw new Error("Size must be 2 or 3."); return start(input.size); }
      });
      window.addEventListener("pagehide",() => lifecycle.abort(),{once:true});
    }
  })();
  </script>
</body>
